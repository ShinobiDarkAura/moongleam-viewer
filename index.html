// Flatten the Round 2 group into {label, filepath, scale} for the fighter selects.
function allCharacterOptions() {
  const out = [];
  const round2 = GROUPS.filter(g => g.label === 'Round 2');
  for (const g of round2) for (const s of g.sections) s.files.forEach((f, i) => {
    const filepath = `${s.dir}/${f}`;
    const label = (s.labels && s.labels[i]) || f.replace(/^.*\//, '').replace('.glb', '')
      .replace(/[-_]/g, ' ').replace(/\bmaimed\b/gi, '').replace(/\bwalking\b/gi, '')
      .replace(/\s+/g, ' ').trim();
    out.push({ label, filepath, scale: s.scale ?? 2.0 });
  });
  return out;
}

// A self-contained mini character viewer for one battle portrait frame: its own
// scene, camera, renderer + PS1/outline pass chain, so each frame can have its
// own background and themed outline (game-UI VS card look).
function createPortraitViewer(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const fscene = new THREE.Scene();
  const fcam = new THREE.PerspectiveCamera(42, 0.75, 0.01, 100);
  fcam.position.set(0, 0.95, 3.3); fcam.lookAt(0, 0.8, 0);
  fscene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const klight = new THREE.DirectionalLight(0xffffff, 1.2);
  klight.position.set(2, 4, 3); klight.castShadow = true;
  klight.shadow.mapSize.set(1024, 1024); klight.shadow.camera.near = 0.5; klight.shadow.camera.far = 20;
  klight.shadow.camera.left = -3; klight.shadow.camera.right = 3; klight.shadow.camera.top = 3; klight.shadow.camera.bottom = -3;
  klight.shadow.bias = -0.001; klight.shadow.radius = 4; fscene.add(klight);
  const flight = new THREE.DirectionalLight(0xaabbff, 0.4); flight.position.set(-2, 1, -1); fscene.add(flight);
  const fground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.45 }));
  fground.rotation.x = -Math.PI / 2; fground.receiveShadow = true; fscene.add(fground);

  const fcomposer = new EffectComposer(renderer);
  fcomposer.addPass(new RenderPass(fscene, fcam));
  const foutline = new OutlinePass(new THREE.Vector2(487, 650), fscene, fcam);
  foutline.edgeStrength = 4; foutline.edgeGlow = 0; foutline.edgeThickness = 2; foutline.pulsePeriod = 0;
  fcomposer.addPass(foutline);
  fcomposer.addPass(new ShaderPass(GammaCorrectionShader));
  const fbright = new ShaderPass(BrightnessShader); fbright.uniforms.brightness.value = 2.53; fcomposer.addPass(fbright);
  const fpix = new ShaderPass(PixelShader); fcomposer.addPass(fpix);
  // Holo + status, per frame (same order as the single-view chain)
  const fholo = new ShaderPass(HoloShader); fholo.enabled = false; fcomposer.addPass(fholo);
  const fstatus = new ShaderPass(StatusShader); fstatus.enabled = false; fcomposer.addPass(fstatus);
  fcomposer.addPass(new ShaderPass(PosterizeShader));

  let model = null, mixer = null, clips = [], action = null, meshes = [], onIdle = null, elapsed = 0;

  function setupAction(clip, forceLoop = false) {
    const a = mixer.clipAction(clip);
    const one = !forceLoop && ONE_SHOT.has(clip.name);   // forceLoop overrides one-shots (manual picker)
    a.setLoop(one ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
    a.clampWhenFinished = one; return a;
  }
  function playClip(name, fade = 0.3, forceLoop = false) {
    if (!mixer) return;
    const clip = clips.find(c => c.name === name); if (!clip) return;
    const next = setupAction(clip, forceLoop);
    if (action === next) { next.reset().play(); return; }
    next.reset(); next.setEffectiveWeight(1); next.fadeIn(fade); next.play();
    if (action) action.fadeOut(fade); action = next;
  }
  function load(filepath, scale, onReady) {
    if (model) { fscene.remove(model); model = null; }
    if (mixer) { mixer.stopAllAction(); mixer = null; }
    clips = []; action = null; meshes = [];
    const url = filepath.split('/').map(encodeURIComponent).join('/');
    loader.load(url, gltf => {
      const m = gltf.scene;
      const wrap = new THREE.Group(); wrap.add(m); fscene.add(wrap); wrap.updateMatrixWorld(true);
      const bb = new THREE.Box3().setFromObject(wrap);
      const size = new THREE.Vector3(); bb.getSize(size);
      const center = new THREE.Vector3(); bb.getCenter(center);
      const s = scale / Math.max(Math.max(size.x, size.y, size.z), 0.001);
      wrap.scale.setScalar(s);
      wrap.position.set(-center.x * s, -center.y * s + (size.y * s * 0.5), -center.z * s);
      const pivot = new THREE.Group(); fscene.remove(wrap); pivot.add(wrap); fscene.add(pivot);
      model = pivot;
      m.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; n.userData.origMat = n.material; meshes.push(n); n.material = makeCharacterMaterial(n.material); } });
      foutline.selectedObjects = meshes;
      fground.position.y = new THREE.Box3().setFromObject(pivot).min.y;
      clips = gltf.animations || [];
      if (clips.length) {
        mixer = new THREE.AnimationMixer(m);
        mixer.addEventListener('finished', e => {
          if (e.action.getClip().name !== 'death') { const r = defaultClipName(clips); if (r) { playClip(r, 0.3); onIdle && onIdle(); } }
        });
      }
      renderer.compile(fscene, fcam);
      onReady && onReady();
    }, undefined, err => console.error('portrait load error', err));
  }
  function resize() {
    const w = canvas.clientWidth || 487, h = canvas.clientHeight || 650;
    const pr = Math.min(window.devicePixelRatio, 2);
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false); fcomposer.setSize(w, h);
    fcam.aspect = w / h; fcam.updateProjectionMatrix();
    foutline.resolution.set(w, h);
    fpix.uniforms.resolution.value.set(w * pr, h * pr);
    fstatus.uniforms.resolution.value.set(w * pr, h * pr);
    fholo.uniforms.resolution.value.set(w * pr, h * pr);
  }
  return {
    load, playClip, resize,
    setTheme: (bg, edgeHex) => { fscene.background = bg; renderer.setClearColor(bg, 1); foutline.visibleEdgeColor.set(edgeHex); foutline.hiddenEdgeColor.set(edgeHex); },
    setRotation: rad => { if (model) model.rotation.y = rad; },
    setShift: x => { if (model) model.position.x = x; },
    setCamera: (dist, ty) => { fcam.position.set(0, ty, dist); fcam.lookAt(0, ty * 0.82, 0); },
    refreshMaterials: (ck) => meshes.forEach(n => { if (n.userData.origMat) n.material = makeCharacterMaterial(n.userData.origMat, ck); }),
    update: dt => {
      if (mixer && !animFrozen) mixer.update(dt);
      elapsed += dt;
      if (fholo.enabled)   fholo.uniforms.time.value   = elapsed;
      if (fstatus.enabled) fstatus.uniforms.time.value = elapsed;
      fcomposer.render();
    },
    getClips: () => clips,
    setOnIdle: cb => { onIdle = cb; },
    setStatus: n => { fstatus.uniforms.status.value = n; fstatus.enabled = n > 0; },
    setHolo: on => { fholo.enabled = on; fground.visible = !on; },
    setHoloColor: col => { fholo.uniforms.holoColor.value.copy(col); },
    getCurrent: () => action ? { name: action.getClip().name, time: action.time, loop: !ONE_SHOT.has(action.getClip().name) } : null,
    setActionTime: t => { if (action) action.time = t; },
  };
}

// Camera presets are per-frame character rotations + camera distance.
const D2R = Math.PI / 180;
// `a`/`b` = per-fighter Y rotation (deg); A is the left frame, B the right.
// A positive turns toward screen-right (inward), B negative toward screen-left → they
// face EACH OTHER. dist/ty frame the shot; aDist/bDist/aTy/bTy override per-frame.
const BATTLE_PRESETS = {
  front:   { a: 0,   b: 0,   dist: 3.3,  ty: 0.95 },
  profile: { a: 90,  b: -90, dist: 3.3,  ty: 0.95 },   // facing each other, front zoom
  // Bust framing, both facing the camera head-on (no rotation).
  angled:  { a: 0,   b: 0,   dist: 1.36, ty: 1.44, bShiftX: 0.04 },
  pokemon: { a: 180, b: 0,   dist: 1.7,  ty: 1.15, bDist: 2.4, bTy: 1.0 }, // A back & near, B facing & smaller
};
let currentPreset = 'front';
function applyPreset(name) {
  const p = BATTLE_PRESETS[name]; if (!p) return;
  currentPreset = name;
  if (frameA) { frameA.setRotation(p.a * D2R); frameA.setCamera(p.aDist ?? p.dist, p.aTy ?? p.ty); frameA.setShift(p.aShiftX ?? 0); }
  if (frameB) { frameB.setRotation(p.b * D2R); frameB.setCamera(p.bDist ?? p.dist, p.bTy ?? p.ty); frameB.setShift(p.bShiftX ?? 0); }
  document.querySelectorAll('#battleControls button')
    .forEach(b => b.classList.toggle('active', b.dataset.preset === name));
}

// Size the two portrait frames: 3:4, ≤650px tall, scaled down to fit the viewport.
function layoutFrames() {
  const vp = document.getElementById('viewport');
  const availH = vp.clientHeight - 90;          // leave room for the preset bar
  const availW = (vp.clientWidth - 64) / 2;     // two frames + gap
  const h = Math.max(120, Math.min(325, availH, availW * 4 / 3));
  const w = h * 3 / 4;
  document.querySelectorAll('.fighter-frame').forEach(el => { el.style.height = h + 'px'; el.style.width = w + 'px'; });
  if (frameA) frameA.resize();
  if (frameB) frameB.resize();
}

function ensureFrames() {
  if (frameA && frameB) return;
  frameA = createPortraitViewer(document.getElementById('frameCanvasA'));
  frameB = createPortraitViewer(document.getElementById('frameCanvasB'));
  frameA.setOnIdle(() => { if (battleAnimPickers.A) battleAnimPickers.A.value = RESTING; });
  frameB.setOnIdle(() => { if (battleAnimPickers.B) battleAnimPickers.B.value = RESTING; });
}

// Each fighter holds a LIST of statuses (1 from the dropdown, or 2–3 from the
// multi-status tester). Channel split: dominant (list[0]) → colour/outline/bg;
// second (list[1]) → particle symbols; the badge row shows them all.
const battleStatusList = { A: [], B: [] };
function frameDominant(key) { return battleStatusList[key][0] || 0; }
function frameParticle(key) { const l = battleStatusList[key]; return (l.length >= 2 ? l[1] : l[0]) || 0; }
function frameColorKey(key) {
  const d = frameDominant(key);
  return (d > 0 && STATUS_META[d]) ? STATUS_META[d].color : currentColorKey;
}
function themeFor(colorKey) {
  const noFilter = colorKey === 'none';
  const p = PALETTE[colorKey];
  return {
    edge: noFilter ? '#888888' : p.hex,
    bg:   noFilter ? new THREE.Color(0x161616) : p.color.clone().multiplyScalar(0.022),
  };
}
// Apply a fighter's colour to its frame: 3D bg, 3D outline, character tint, holo
// hue, the CSS frame border, plus the particle status + badge row.
function applyFrameColor(key) {
  const frame = key === 'A' ? frameA : frameB;
  if (!frame) return;
  const ck = frameColorKey(key);
  const t = themeFor(ck);
  frame.setTheme(t.bg, t.edge);
  frame.refreshMaterials(ck);
  const pc = PALETTE[ck];
  if (pc && pc.color) frame.setHoloColor(pc.color);
  const el = document.getElementById(key === 'A' ? 'frameCanvasA' : 'frameCanvasB').parentElement;
  if (el) el.style.setProperty('--active-color', t.edge);
  frame.setStatus(frameParticle(key));
  renderFrameBadges(key);
}
function refreshBattleTheme() { applyFrameColor('A'); applyFrameColor('B'); }

// Play a clip on one fighter, phase-aligned to the partner if both loop the same
// clip — so idle/walk stay in sync between the two frames.
function playFrame(key, name, fade = 0.3, loop = false) {
  const frame = key === 'A' ? frameA : frameB;
  const partner = key === 'A' ? frameB : frameA;
  if (!frame) return;
  frame.playClip(name, fade, loop);
  if (!ONE_SHOT.has(name) && partner) {
    const pc = partner.getCurrent();
    if (pc && pc.name === name && pc.loop) frame.setActionTime(pc.time);
  }
}

function populateStatusPickers() {
  if (battleStatusPickers.A.options.length) return;
  let html = '<option value="0">— None —</option>';
  for (let i = 1; i < STATUS_META.length; i++) html += `<option value="${i}">${STATUS_META[i].label}</option>`;
  battleStatusPickers.A.innerHTML = html;
  battleStatusPickers.B.innerHTML = html;
}

function populateFramePicker(key) {
  const frame = key === 'A' ? frameA : frameB;
  const sel = battleAnimPickers[key];
  const fclips = frame.getClips().filter(c => !HIDDEN_CLIPS.has(c.name));
  if (fclips.length <= 1) { sel.innerHTML = ''; sel.style.display = 'none'; return; }
  const sorted = fclips.sort((x, y) => {
    const ix = CLIP_ORDER.indexOf(x.name), iy = CLIP_ORDER.indexOf(y.name);
    return (ix < 0 ? 99 : ix) - (iy < 0 ? 99 : iy);
  });
  sel.innerHTML = sorted.map(c => `<option value="${c.name}">${clipLabel(c.name)}</option>`).join('');
  sel.style.display = 'block';
}

function loadFrame(key, filepath, scale) {
  const frame = key === 'A' ? frameA : frameB;
  loadingEl.style.display = 'flex';
  frame.load(filepath, scale, () => {
    populateFramePicker(key);
    const def = defaultClipName(frame.getClips());
    if (def) { if (battleAnimPickers[key]) battleAnimPickers[key].value = def; playFrame(key, def, 0); }
    // restore this fighter's status list (single from dropdown, or keep the
    // multi-status roll) then colour the frame (applyFrameColor sets status+badges)
    if (multiOn) { if (!battleStatusList[key].length) battleStatusList[key] = rollStatuses(); }
    else { const v = battleStatusPickers[key] ? parseInt(battleStatusPickers[key].value || '0') : 0; battleStatusList[key] = v > 0 ? [v] : []; }
    frame.setHolo(document.getElementById('holoToggle').checked);
    applyFrameColor(key);
    applyPreset(currentPreset);
    frame.resize();
    loadingEl.style.display = 'none';
  });
}

function enterBattleMode() {
  if (viewMode === 'battle') return;
  viewMode = 'battle';
  lastSingleFilepath = currentFilepath;
  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  if (mixer) { mixer.stopAllAction(); mixer = null; }
  currentAction = null;
  controls.autoRotate = false;
  ensureFrames();

  document.getElementById('canvas').style.display = 'none';
  document.getElementById('battleStage').classList.add('active');
  listEl.style.display = 'none';
  document.getElementById('battlePanel').classList.add('active');
  document.getElementById('battleControls').classList.add('active');
  document.getElementById('viewerControls').style.display = 'none';
  if (animPicker) animPicker.style.display = 'none';
  nameTag.textContent = '';
  populateStatusPickers();

  if (!slotAChar.options.length) {
    const opts = allCharacterOptions();
    const html = opts.map(o => `<option value="${o.filepath}" data-scale="${o.scale}">${o.label}</option>`).join('');
    slotAChar.innerHTML = html; slotBChar.innerHTML = html;
    // Defaults: Fighter A = Base Alt Male 1, Fighter B = Boss Male 4 (both fully animated)
    if ([...slotAChar.options].some(o => o.value === 'models/Maimed Purple Tech.glb')) slotAChar.value = 'models/Maimed Purple Tech.glb';
    if ([...slotBChar.options].some(o => o.value === 'models/bosses/boss_green_mech_walking.glb')) slotBChar.value = 'models/bosses/boss_green_mech_walking.glb';
  }
  document.getElementById('statusBadges').style.display = 'none';   // single-view badges
  if (multiOn) { battleStatusList.A = rollStatuses(); battleStatusList.B = rollStatuses(); }
  layoutFrames();
  loadFrame('A', slotAChar.value, parseFloat(slotAChar.selectedOptions[0]?.dataset.scale || '2'));
  loadFrame('B', slotBChar.value, parseFloat(slotBChar.selectedOptions[0]?.dataset.scale || '2'));
  applyPreset('front');
  updateRollVisibility();
}

function exitBattleMode() {
  if (viewMode !== 'battle') return;
  viewMode = 'single';
  stopBattleSeq();
  document.getElementById('battleStage').classList.remove('active');
  document.getElementById('canvas').style.display = '';
  document.getElementById('battlePanel').classList.remove('active');
  document.getElementById('battleControls').classList.remove('active');
  document.getElementById('viewerControls').style.display = '';
  listEl.style.display = '';
  document.getElementById('badgesA').style.display = 'none';
  document.getElementById('badgesB').style.display = 'none';
  document.querySelectorAll('.frame-refresh').forEach(b => b.style.display = 'none');
  updateRollVisibility();
  // reset to the single-view default camera, then reload the last single character
  camera.position.set(0, 1.2, 3.5);
  controls.target.set(0, 0.9, 0); controls.update();
  const active = document.querySelector('.char-item.active');
  if (active) active.click();
  else if (lastSingleFilepath) loadCharacter(lastSingleFilepath, false, 2.0);
}

// ── Auto-fight sequence: A↔B trade attack/hit ×5, then B dies ──
let battleSeqOn = false;
let battleSeqTimers = [];
function stopBattleSeq() {
  battleSeqOn = false;
  battleSeqTimers.forEach(clearTimeout); battleSeqTimers = [];
  const btn = document.getElementById('battleSeqBtn');
  btn.textContent = 'BATTLE: OFF'; btn.classList.remove('active');
  if (frameA) { playFrame('A', RESTING, 0.3); if (battleAnimPickers.A) battleAnimPickers.A.value = RESTING; }
  if (frameB) { playFrame('B', RESTING, 0.3); if (battleAnimPickers.B) battleAnimPickers.B.value = RESTING; }
}
function startBattleSeq() {
  if (!frameA || !frameB) return;
  battleSeqOn = true;
  battleSeqTimers = [];   // fresh timer set (prevents accumulation across loops)
  const btn = document.getElementById('battleSeqBtn');
  btn.textContent = 'BATTLE: ON'; btn.classList.add('active');
  const at = (ms, fn) => battleSeqTimers.push(setTimeout(fn, ms));
  const step = 1300; let t = 0;
  for (let i = 0; i < 5; i++) {                       // 5 exchanges
    at(t, () => { playFrame('A', 'attack', 0.12); playFrame('B', 'hit', 0.12); }); t += step;
    at(t, () => { playFrame('B', 'attack', 0.12); playFrame('A', 'hit', 0.12); }); t += step;
  }
  at(t, () => { playFrame('A', RESTING, 0.3); playFrame('B', 'death', 0.2); }); t += step; // right dies
  at(t + 900, () => { if (battleSeqOn) startBattleSeq(); });   // hold the death beat, then replay from the top
}
document.getElementById('battleSeqBtn').addEventListener('click', () => {
  battleSeqOn ? stopBattleSeq() : startBattleSeq();
});

// Wire battle controls
slotAChar.addEventListener('change', e => loadFrame('A', e.target.value, parseFloat(e.target.selectedOptions[0]?.dataset.scale || '2')));
slotBChar.addEventListener('change', e => loadFrame('B', e.target.value, parseFloat(e.target.selectedOptions[0]?.dataset.scale || '2')));
// Manual picker selection loops the chosen clip (even one-shots like attack/hit/death)
battleAnimPickers.A.addEventListener('change', e => { playFrame('A', e.target.value, 0.3, true); e.target.blur(); });
battleAnimPickers.B.addEventListener('change', e => { playFrame('B', e.target.value, 0.3, true); e.target.blur(); });
battleStatusPickers.A.addEventListener('change', e => { const v = parseInt(e.target.value); battleStatusList.A = v > 0 ? [v] : []; applyFrameColor('A'); e.target.blur(); });
battleStatusPickers.B.addEventListener('change', e => { const v = parseInt(e.target.value); battleStatusList.B = v > 0 ? [v] : []; applyFrameColor('B'); e.target.blur(); });
document.querySelectorAll('#battleControls button').forEach(b =>
  b.addEventListener('click', () => { applyPreset(b.dataset.preset); b.blur(); }));

// ── Multi-status tester ───────────────────────────────────────────────────────
// Toggle assigns 2–3 random statuses; dominant → outline/bg/tint, 2nd → particles,
// all shown as colour-coded chips. Works in single (Round 1/2) + battle (per fighter).
let multiOn = false;
let singleStatusList = [];
let savedFilterKey = currentColorKey, savedStatus = currentStatus;
const statusBadgesEl = document.getElementById('statusBadges');

// Inner SVG markup per status index (stroke = currentColor → inherits chip colour).
const STATUS_GLYPHS = {
  1:  '<path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/>',                          // Vigor — chevrons up
  2:  '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>', // Strike — zap
  3:  '<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>', // Burn — flame
  4:  '<path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/>', // Corrosion — skull
  5:  '<path d="M5 12h14"/><path d="M12 5v14"/>',                                        // Regen — plus
  6:  '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>', // Block — shield
  7:  '<path d="m18 8 4 4-4 4"/><path d="M2 12h20"/><path d="m6 8-4 4 4 4"/>',            // Reflect — bounce
  8:  '<path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/>',                                // Weak — chevrons down
  9:  '<path d="M13 2 7 13l4 1-3 8"/>',                                                   // Frail — crack
  10: '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>',                               // Leech — droplet
  11: '<path d="M12 3v18"/><path d="M3 12h18"/><path d="m5.6 5.6 12.8 12.8"/><path d="m18.4 5.6-12.8 12.8"/>', // Clear — burst
  12: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',                   // Purge — ban
};

function rollStatuses() {
  const n = 2 + Math.floor(Math.random() * 4);                 // 2–5 (only 2 render; rest are chips)
  const pool = []; for (let i = 1; i < STATUS_META.length; i++) pool.push(i);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, n);
}
function statusHex(idx) { const m = STATUS_META[idx]; return (m && PALETTE[m.color]) ? PALETTE[m.color].hex : '#888'; }
const REFRESH_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>';
function renderBadges(container, list, scope) {
  const chips = (list || []).map(i => {
    const hex = statusHex(i), m = STATUS_META[i];
    // Glyphs are the default chip now.
    return `<span class="status-chip glyph" title="${m.label}" style="color:${hex}">` +
      `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${STATUS_GLYPHS[i] || ''}</svg></span>`;
    // ── Text-chip version (kept for reference) ──
    // return `<span class="status-chip" style="color:${hex}">${m.abbr}</span>`;
  }).join('');
  // Single view keeps an inline re-roll chip next to the statuses; battle frames
  // use a FIXED button below each frame (added in HTML) so it never shifts with chip count.
  const refresh = scope === 'single'
    ? `<button class="status-chip status-refresh" data-scope="${scope}" title="Re-roll statuses">${REFRESH_SVG}</button>`
    : '';
  container.innerHTML = chips + refresh;
}
function renderFrameBadges(key) {
  const cont = document.getElementById(key === 'A' ? 'badgesA' : 'badgesB');
  renderBadges(cont, battleStatusList[key], key);
  const show = multiOn && battleStatusList[key].length;
  cont.style.display = show ? 'block' : 'none';
  const btn = document.querySelector(`.frame-refresh[data-scope="${key}"]`);
  if (btn) btn.style.display = show ? 'block' : 'none';
}
function handleRefresh(scope) {
  if (scope === 'single') { singleStatusList = rollStatuses(); applySingleMulti(); }
  else { battleStatusList[scope] = rollStatuses(); applyFrameColor(scope); }
}
['statusBadges', 'badgesA', 'badgesB'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('.status-refresh'); if (b) handleRefresh(b.dataset.scope);
  });
});
// Fixed re-roll buttons below the battle frames
document.querySelectorAll('.frame-refresh').forEach(btn => {
  btn.addEventListener('click', () => handleRefresh(btn.dataset.scope));
});

// Single view: dominant drives colour/bg/tint, 2nd drives particles, chips show all.
function applySingleMulti() {
  if (!singleStatusList.length) singleStatusList = rollStatuses();
  const dom = singleStatusList[0], part = singleStatusList[1] || 0;
  currentColorKey = STATUS_META[dom].color;
  applyTint(currentColorKey);
  currentStatus = part;
  statusPass.uniforms.status.value = part; statusPass.enabled = part > 0;
  renderBadges(statusBadgesEl, singleStatusList, 'single');
  statusBadgesEl.style.display = 'block';
}

function updateRollVisibility() {
  document.getElementById('statusPicker').disabled = multiOn;
  if (battleStatusPickers.A) battleStatusPickers.A.disabled = multiOn;
  if (battleStatusPickers.B) battleStatusPickers.B.disabled = multiOn;
  if (!multiOn) {
    statusBadgesEl.style.display = 'none';
    document.getElementById('badgesA').style.display = 'none';
    document.getElementById('badgesB').style.display = 'none';
    document.querySelectorAll('.frame-refresh').forEach(b => b.style.display = 'none');
  }
}

function rollCurrentMode() {
  if (viewMode === 'battle') {
    battleStatusList.A = rollStatuses(); battleStatusList.B = rollStatuses();
    applyFrameColor('A'); applyFrameColor('B');
  } else {
    singleStatusList = rollStatuses(); applySingleMulti();
  }
}

document.getElementById('multiToggle').addEventListener('change', e => {
  multiOn = e.target.checked;
  document.getElementById('multiWrap').classList.toggle('active', multiOn);
  if (multiOn) {
    if (viewMode === 'single') { savedFilterKey = currentColorKey; savedStatus = currentStatus; }
    updateRollVisibility();
    rollCurrentMode();
  } else {
    updateRollVisibility();
    if (viewMode === 'battle') {
      for (const k of ['A', 'B']) {
        const v = parseInt(battleStatusPickers[k].value || '0');
        battleStatusList[k] = v > 0 ? [v] : [];
        applyFrameColor(k);
      }
    } else {
      currentColorKey = savedFilterKey; applyTint(currentColorKey);
      currentStatus = savedStatus;
      statusPass.uniforms.status.value = savedStatus; statusPass.enabled = savedStatus > 0;
    }
  }
});


// ── Render loop ──────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (viewMode === 'battle') {
    if (frameA) frameA.update(dt);   // each frame updates its own mixer + renders its composer
    if (frameB) frameB.update(dt);
    return;
  }

  if (mixer && !animFrozen) mixer.update(dt);
  controls.update();

  const elapsed = clock.getElapsedTime();
  if (holoPass.enabled)  holoPass.uniforms.time.value   = elapsed;
  if (currentStatus > 0) statusPass.uniforms.time.value = elapsed;

  composer.render();
}
animate();
</script>
</body>
