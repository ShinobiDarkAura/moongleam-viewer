<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moongleam — Character Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 20px;
      background: #111;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    select {
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #333;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: #555; }

    .intensity-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 80px;
      height: 3px;
      background: #333;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
      cursor: pointer;
    }

    .zoom-wrap {
      display: flex;
      gap: 4px;
    }

    .zoom-wrap button {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      width: 26px;
      height: 26px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.1s, border-color 0.1s;
    }

    .zoom-wrap button:hover { color: #ccc; border-color: #555; }
    .zoom-wrap button:active { background: #222; }

    .desat-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      user-select: none;
    }
    .desat-wrap:hover { color: #888; }
    .desat-wrap input[type=checkbox] {
      accent-color: #888;
      cursor: pointer;
    }

    .ps1-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      user-select: none;
      padding-left: 10px;
      border-left: 1px solid #222;
    }
    .ps1-wrap:hover { color: #888; }
    .ps1-wrap.active { color: #ff9944; }
    .ps1-wrap input[type=checkbox] {
      accent-color: #ff9944;
      cursor: pointer;
    }

    .holo-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      user-select: none;
      padding-left: 10px;
      border-left: 1px solid #222;
    }
    .holo-wrap:hover { color: #888; }
    .holo-wrap.active { color: #44ddff; }
    .holo-wrap input[type=checkbox] {
      accent-color: #44ddff;
      cursor: pointer;
    }

    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid #444;
      flex-shrink: 0;
    }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    aside {
      width: 200px;
      background: #0f0f0f;
      border-right: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    #charList {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      background: #1a1a1a;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1 1 auto;
      padding: 7px 4px;
      font-family: inherit;
      font-size: 8px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #666;
      background: #0f0f0f;
      border: none;
      cursor: pointer;
      transition: color 0.1s, background 0.1s;
      white-space: nowrap;
    }

    .tab-btn:hover { color: #aaa; background: #141414; }
    .tab-btn.active { color: var(--active-color, #44ff88); background: #111; }

    .tab-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .tab-panel.active { display: block; }
    .tab-panel::-webkit-scrollbar { width: 4px; }
    .tab-panel::-webkit-scrollbar-track { background: #0f0f0f; }
    .tab-panel::-webkit-scrollbar-thumb { background: #2a2a2a; }

    .char-item {
      padding: 9px 14px;
      font-size: 11px;
      color: #555;
      cursor: pointer;
      border-bottom: 1px solid #161616;
      transition: color 0.1s, background 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .char-item { color: #777; }
    .char-item:hover { background: #161616; color: #aaa; }
    .char-item.active { color: var(--active-color, #44ff88); background: #141414; }

    .section-head {
      padding: 10px 14px 4px;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #3a3a3a;
      margin-top: 2px;
    }
    .section-head:first-child { margin-top: 0; }

    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #444;
      pointer-events: none;
    }

    #model-name {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #333;
      pointer-events: none;
    }
  </style>
</head>
<body>

<header>
  <h1>Moongleam // Characters</h1>
  <div class="controls">
    <label>Filter</label>
    <div class="color-swatch" id="swatch"></div>
    <select id="colorPicker">
      <option value="none">No Filter</option>
      <option value="green" selected>Green</option>
      <option value="cyan">Cyan</option>
      <option value="orange">Orange</option>
      <option value="pink">Pink</option>
      <option value="purple">Purple</option>
      <option value="red">Red</option>
    </select>
    <div class="intensity-wrap">
      <label>Intensity</label>
      <input type="range" id="intensity" min="0" max="100" value="100" />
    </div>
    <div class="intensity-wrap">
      <label>Brightness</label>
      <input type="range" id="brightness" min="20" max="300" value="253" />
    </div>
    <label class="desat-wrap">
      <input type="checkbox" id="desaturate" checked />
      Desaturate
    </label>
    <label class="ps1-wrap" id="ps1Wrap">
      <input type="checkbox" id="ps1Toggle" />
      PS1
    </label>
    <label class="holo-wrap" id="holoWrap">
      <input type="checkbox" id="holoToggle" />
      Holo
    </label>
    <div class="intensity-wrap" style="padding-left:10px;border-left:1px solid #222;">
      <label>Status</label>
      <select id="statusPicker">
        <option value="0">— None —</option>
        <option value="1">Vigor</option>
        <option value="2">Strike</option>
        <option value="3">Burn</option>
        <option value="4">Corrosion</option>
        <option value="5">Regen</option>
        <option value="6">Block</option>
        <option value="7">Reflect</option>
        <option value="8">Weak</option>
        <option value="9">Frail</option>
        <option value="10">Leech</option>
        <option value="11">Clear</option>
        <option value="12">Purge</option>
      </select>
    </div>
    <div class="zoom-wrap">
      <button id="zoomOut">−</button>
      <button id="zoomIn">+</button>
    </div>
  </div>
</header>

<main>
  <aside>
    <div class="tab-bar" id="tabBar"></div>
    <div id="charList"></div>
  </aside>
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div id="loading">SELECT A CHARACTER</div>
    <div id="model-name"></div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass }    from 'three/addons/postprocessing/OutlinePass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';

// ── Palette ──────────────────────────────────────────────────────────────────
const PALETTE = {
  none:   { hex: null,      color: null },
  green:  { hex: '#44ff88', color: new THREE.Color(0x44ff88) },
  cyan:   { hex: '#00ffe0', color: new THREE.Color(0x00ffe0) },
  orange: { hex: '#ff8800', color: new THREE.Color(0xff8800) },
  pink:   { hex: '#ff44cc', color: new THREE.Color(0xff44cc) },
  purple: { hex: '#aa44ff', color: new THREE.Color(0xaa44ff) },
  red:    { hex: '#ff3333', color: new THREE.Color(0xff3333) },
};

const GROUPS = [
  { label: 'Round 1', sections: [
    { heading: 'Elite', dir: 'models', scale: 1.63, autoRotate: false, files: [
      'Neutral-Female.glb',
      'Neutral-Male.glb',
      'Green Female.glb',
      'Maimed-Green-Male-Walking.glb',
      'Maimed-Orange-Female-Walking.glb',
      'Maimed-Orange-Male-Walking.glb',
    ]},
    { heading: 'Bosses', dir: 'models', scale: 1.63, autoRotate: false, files: [
      'Maimed-Pink-Female-Walking.glb',
      'Maimed-Pink-Male-Walking.glb',
      'Maimed-Purple-Female-Walking.glb',
      'Maimed-Purple-Male-Walking.glb',
      'Maimed-Red-Female-Walking.glb',
      'Maimed-Red-Male-Walking.glb',
    ]},
    { heading: 'Base Characters', dir: 'models', scale: 1.63, autoRotate: false, files: [
      'Base Female Orange V2.glb',
      'Tactical Female Black.glb',
    ]},
    { heading: 'Enemies', dir: 'models', scale: 1.5, autoRotate: false, files: [
      'enemies/basic_enemy_v2.glb',
      'enemies/elite_enemy_v2.glb',
      'enemies/maimed_enemy_v2.glb',
    ]},
    { heading: 'Boss Units', dir: 'models', scale: 1.0, autoRotate: false, files: [
      'bosses/boss_spider_tank.glb',
      'bosses/Boss Male Red.glb',
    ]},
    { heading: 'V2 Frames', dir: 'models', scale: 1.5, autoRotate: false, files: [
      'v2_enemies/Skull Punk Female.glb',
      'v2_enemies/Hooded Knight Blue.glb',
      'v2_enemies/Wasteland Scavenger.glb',
      'v2_enemies/Gas Mask Operative.glb',
      'v2_enemies/Cable Tech Male.glb',
      'v2_enemies/Green Mech Unit.glb',
      'v2_enemies/Cyborg Enforcer Orange.glb',
      'v2_enemies/Pink Cyborg Warrior.glb',
      'v2_enemies/Pink Dino Mech.glb',
    ]},
    { heading: 'Items', dir: 'models', scale: 1.0, autoRotate: false, files: [
      'items/item_battery_cell.glb',
      'items/item_module_fragment.glb',
      'items/item_module_kit.glb',
      'items/item_weapon_fragment.glb',
      'items/item_weapon_kit.glb',
      'items/loot_crate.glb',
      'items/module_fragment_option1.glb',
      'items/weapon_fragment_option2.glb',
      'items/Energy Canister.glb',
      'items/Health Chip.glb',
      'items/Purple Processor.glb',
      'items/Purple Crystal.glb',
    ]},
    { heading: 'Scraps', dir: 'models', scale: 1.0, autoRotate: false, files: [
      'scraps/item_scrap.glb',
      'scraps/scrap_option2.glb',
      'scraps/hexagonal_tokens.glb',
      'scraps/ingot_bars.glb',
      'scraps/octagonal_chips.glb',
      'scraps/threaded_slugs.glb',
      'scraps/triangular_shards.glb',
    ]},
  ]},
  { label: 'Round 2', sections: [
    { heading: 'Bosses', dir: 'models', scale: 1.63, autoRotate: false, files: [
      'enemies/Maimed Male 1.glb',
      'enemies/Maimed Female 1.glb',
      'enemies/Maimed Male 2.glb',
      'enemies/Maimed Female 2.glb',
      'enemies/Maimed Male 3.glb',
      'enemies/Maimed Female 3.glb',
      'bosses/Boss Male 1.glb',
      'bosses/Boss Male 2.glb',
    ], labels: [
      'Boss Male 1',
      'Boss Female 1',
      'Boss Male 2',
      'Boss Female 2',
      'Boss Male 3',
      'Boss Female 3',
      'Boss Male 4',
      'Boss Male 5',
    ]},
    { heading: 'Elite', dir: 'models', scale: 1.63, autoRotate: false, files: [
      'enemies/Elite Male 1.glb',
      'enemies/Elite Female 1.glb',
      'enemies/Elite Male 2.glb',
      'enemies/Elite Female 2.glb',
      'enemies/Elite Male 3.glb',
      'enemies/Elite Female 3.glb',
    ]},
    { heading: 'BASE', dir: 'models', scale: 1.63, autoRotate: false, files: [
      'enemies/Base Male 1.glb',
      'enemies/Base Female 1.glb',
      'enemies/Base Male 2.glb',
      'enemies/Base Female 2.glb',
      'enemies/Base Male 3.glb',
      'enemies/Base Female 3.glb',
    ]},
    { heading: 'Boss', dir: 'models', scale: 1.63, autoRotate: false, files: [
      'bosses/Boss Male 1.glb',
      'bosses/Boss Male 2.glb',
      'bosses/Boss Male 3.glb',
      'bosses/Boss Female 1.glb',
      'bosses/Boss Female 2.glb',
      'bosses/Boss Female 3.glb',
    ]},
  ]},
];

// ── Renderer ─────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const loadingEl = document.getElementById('loading');
const nameTag  = document.getElementById('model-name');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
camera.position.set(0, 1.2, 3.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.25;
controls.rotateSpeed = 1.8;
controls.autoRotate = false;
controls.autoRotateSpeed = 2.2;
controls.target.set(0, 0.9, 0);
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(2, 4, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 3;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.001;
key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight(0xaabbff, 0.4);
fill.position.set(-2, 1, -1);
scene.add(fill);

// Shadow ground plane — invisible, just catches shadows
const groundGeo = new THREE.PlaneGeometry(10, 10);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.45 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ── Post-processing ──────────────────────────────────────────────────────────
const composer   = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const outlinePass = new OutlinePass(new THREE.Vector2(800, 600), scene, camera);
outlinePass.edgeStrength  = 4;
outlinePass.edgeGlow      = 0;
outlinePass.edgeThickness = 2;
outlinePass.pulsePeriod   = 0;
composer.addPass(outlinePass);

composer.addPass(new ShaderPass(GammaCorrectionShader));

const BrightnessShader = {
  uniforms: { tDiffuse: { value: null }, brightness: { value: 2.53 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float brightness; varying vec2 vUv;
    void main() { vec4 c = texture2D(tDiffuse, vUv); gl_FragColor = vec4(c.rgb * brightness, c.a); }`,
};
const brightnessPass = new ShaderPass(BrightnessShader);
composer.addPass(brightnessPass);

// PS1 — Pixelation pass (simulates 320×240 low-res render)
const PixelShader = {
  uniforms: {
    tDiffuse:  { value: null },
    resolution: { value: new THREE.Vector2(800, 600) },
    pixelSize:  { value: 2.5 },
  },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 resolution;
    uniform float pixelSize;
    varying vec2 vUv;
    void main() {
      vec2 dxy = pixelSize / resolution;
      vec2 coord = dxy * floor(vUv / dxy);
      gl_FragColor = texture2D(tDiffuse, coord);
    }`,
};
const pixelPass = new ShaderPass(PixelShader);
pixelPass.enabled = true;
composer.addPass(pixelPass);

// PS1 — Posterization pass (reduces to ~16-bit color depth)
const PosterizeShader = {
  uniforms: {
    tDiffuse: { value: null },
    levels:   { value: 20.0 },
  },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float levels;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      gl_FragColor = vec4(floor(c.rgb * levels + 0.5) / levels, c.a);
    }`,
};
const posterizePass = new ShaderPass(PosterizeShader);
posterizePass.enabled = true;
composer.addPass(posterizePass);

// Background colour as vec3 for mask detection in shaders
// mask = how much a pixel differs from the scene bg (#0a0a0a)
// Used by holo + status shaders to confine effects to the character

// ── Hologram pass ────────────────────────────────────────────────────────────
const HoloShader = {
  uniforms: {
    tDiffuse:  { value: null },
    time:      { value: 0.0 },
    holoColor: { value: new THREE.Color(0x44ff88) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform vec3 holoColor;
    varying vec2 vUv;

    float hash(float n){ return fract(sin(n)*43758.5453); }

    void main(){
      // ── Horizontal glitch bands ──
      float bandRow  = floor(vUv.y * 80.0);
      float bandTime = floor(time * 12.0);
      float trigger  = hash(bandRow * 127.1 + bandTime * 311.7);
      float isGlitch = step(0.80, trigger);
      float glitchAmt = (hash(bandRow * 92.3 + bandTime * 17.0) - 0.5) * 0.18 * isGlitch;

      // ── Large tear / full-row displacement ──
      float tearRow  = floor(vUv.y * 20.0);
      float tearTime = floor(time * 5.0);
      float tearTrig = step(0.92, hash(tearRow * 53.1 + tearTime * 79.3));
      float tearAmt  = (hash(tearRow + tearTime) - 0.5) * 0.28 * tearTrig;

      // ── Chromatic aberration on glitch ──
      float aberr = (glitchAmt + tearAmt) * 0.4;
      vec2 uv = vec2(vUv.x + glitchAmt + tearAmt, vUv.y);
      float lumR = dot(texture2D(tDiffuse, uv + vec2( aberr, 0.0)).rgb, vec3(0.299,0.587,0.114));
      float lumG = dot(texture2D(tDiffuse, uv).rgb,                      vec3(0.299,0.587,0.114));
      float lumB = dot(texture2D(tDiffuse, uv - vec2( aberr, 0.0)).rgb, vec3(0.299,0.587,0.114));
      vec4 base = texture2D(tDiffuse, uv);
      float lum = lumG;

      // ── Hologram colour with chromatic split ──
      vec3 holo = vec3(
        holoColor.r * (lumR * 1.8 + 0.08),
        holoColor.g * (lumG * 1.8 + 0.08),
        holoColor.b * (lumB * 1.8 + 0.08)
      );

      // ── Scan lines (thicker, higher contrast) ──
      float scan = 0.55 + 0.45 * sin(vUv.y * 180.0 + time * 5.0);
      scan = pow(scan, 1.5);
      holo *= scan;

      // ── Rolling brightness wave (more dramatic) ──
      float roll = 0.72 + 0.28 * sin(vUv.y * 4.0 - time * 2.2);
      holo *= roll;

      // ── Hard flicker bursts ──
      float flicker = 0.80 + 0.20 * hash(floor(time * 18.0));
      float bigFlicker = step(0.94, hash(floor(time * 6.0))) * 0.5; // occasional full dim
      holo *= flicker * (1.0 - bigFlicker);

      // ── Translucency (full screen — bg goes holo too) ──
      float opacity = clamp(lum * 0.55 + 0.10, 0.0, 0.68);
      vec3 col = mix(vec3(0.0), holo, opacity);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
};
const holoPass = new ShaderPass(HoloShader);
holoPass.enabled = false;

// ── Status Effect pass ───────────────────────────────────────────────────────
const StatusShader = {
  uniforms: {
    tDiffuse: { value: null },
    time:     { value: 0.0 },
    status:   { value: 0.0 },  // 0=none, 1-12 = effect index
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform float status;
    varying vec2 vUv;

    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p); vec2 f=fract(p);
      float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
      vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
    }
    float fbm(vec2 p){ return noise(p)*0.5+noise(p*2.1)*0.25+noise(p*4.3)*0.125; }

    void main(){
      vec4 base = texture2D(tDiffuse, vUv);
      // Sample a corner pixel as the true background reference
      vec3 bgCol = texture2D(tDiffuse, vec2(0.01, 0.01)).rgb;
      float mask = smoothstep(0.04, 0.14, length(base.rgb - bgCol));
      vec3 col = base.rgb;
      float lum = dot(col, vec3(0.299,0.587,0.114));
      float s = status;

      // 1 — Vigor: heartbeat red energy veins
      if(s < 1.5){
        // Heartbeat: two sharp thumps (lub-dub) then silence
        float t = mod(time * 1.3, 1.0);
        float lub = exp(-pow((t - 0.08) * 28.0, 2.0));
        float dub = exp(-pow((t - 0.22) * 38.0, 2.0)) * 0.7;
        float beat = lub + dub;
        // Veins swell with each beat
        float vein = fbm(vUv*4.0 + vec2(0.0, time*0.3) + beat*0.08);
        vein = smoothstep(0.45, 0.72, vein);
        // Base red tint always on, slams bright on beat
        col = mix(col, col * vec3(2.5, 0.15, 0.15), 0.35 + vein * 0.45);
        col += vec3(1.0, 0.0, 0.0) * beat * 0.55;
        col += vec3(0.6, 0.0, 0.0) * vein * (0.3 + beat * 0.5);

      // 2 — Strike: electric red streaks
      } else if(s < 2.5){
        float bolt = noise(vec2(vUv.x*1.5, time*10.0+vUv.y*0.3));
        bolt = smoothstep(0.72,0.78,bolt);
        float vert = abs(fract(vUv.x*25.0+noise(vec2(vUv.x*3.0,time*5.0))*2.0)-0.5)*2.0;
        vert = smoothstep(0.85,1.0,vert);
        float flash = 0.5+0.5*sin(time*12.0+vUv.y*20.0);
        col = mix(col, vec3(1.0,0.05,0.05)*2.0, (bolt+vert)*0.6*flash);
        col += vec3(0.5,0.0,0.0)*(bolt+vert)*0.3;

      // 3 — Burn: fire scrolling up
      } else if(s < 3.5){
        vec2 fuv = vUv*vec2(1.5,2.0) + vec2(fbm(vUv*2.0+time*0.3)*0.3, -time*0.7);
        float fire = fbm(fuv*3.0);
        fire = smoothstep(0.35,0.8,fire) * (1.0-vUv.y*0.6);
        vec3 fireCol = mix(vec3(1.0,0.15,0.0),vec3(1.0,0.7,0.0),fire);
        fireCol = mix(fireCol,vec3(1.0,1.0,0.8),fire*fire);
        float flicker = 0.7+0.3*sin(time*17.0)*sin(time*7.3);
        col = mix(col, col*fireCol*1.5, fire*0.65*flicker);
        col += fireCol*fire*0.2*flicker;

      // 4 — Corrosion: dripping acid bubbles
      } else if(s < 4.5){
        vec2 auv = vUv*vec2(6.0,8.0) + vec2(0.0, time*0.25);
        float drip = noise(auv);
        float bubble = smoothstep(0.62,0.68,drip)*smoothstep(0.72,0.68,drip);
        float spots = smoothstep(0.55,0.8,fbm(vUv*9.0+time*0.1));
        col = mix(col, vec3(0.35,0.85,0.05)*1.8, spots*0.5);
        col = mix(col, vec3(1.0,0.9,0.0)*2.0, bubble*0.8);
        col *= 1.0-spots*0.25;

      // 5 — Regen: rising green sparkles + glow
      } else if(s < 5.5){
        float beat = 0.5+0.5*sin(time*2.5);
        vec2 suv = vec2(vUv.x*3.0, fract(vUv.y - time*0.4)*3.0);
        float sparkle = noise(suv*8.0+time)*noise(suv*5.0);
        sparkle = smoothstep(0.6,0.9,sparkle)*(1.0-vUv.y*0.5);
        col = mix(col, col+vec3(0.0,0.8,0.3), 0.3+beat*0.15);
        col += vec3(0.1,1.0,0.4)*sparkle*0.9*beat;
        col += vec3(0.0,0.3,0.1)*beat*0.1;

      // 6 — Block: blue crystal lattice shield
      } else if(s < 6.5){
        float gx = abs(sin(vUv.x*28.0));
        float gy = abs(sin(vUv.y*28.0));
        float grid = smoothstep(0.88,0.95,max(gx,gy));
        float diag = smoothstep(0.88,0.95,abs(sin((vUv.x+vUv.y)*20.0)));
        float pulse = 0.4+0.6*abs(sin(time*1.8));
        col = mix(col, vec3(0.2,0.5,1.0)*2.0, (grid+diag*0.5)*pulse*0.7);
        col += vec3(0.05,0.15,0.4)*0.2*pulse;

      // 7 — Reflect: rotating shimmer + distortion
      } else if(s < 7.5){
        float ang = time*0.8;
        float ca=cos(ang),sa=sin(ang);
        vec2 ruv=vec2(ca*(vUv.x-0.5)-sa*(vUv.y-0.5)+0.5, sa*(vUv.x-0.5)+ca*(vUv.y-0.5)+0.5);
        float shim = smoothstep(0.55,0.85,noise(ruv*12.0)*noise(ruv*6.0+time*0.5));
        vec2 distUv = vUv + vec2(noise(vUv*8.0+time)-0.5,noise(vUv*8.0-time)-0.5)*0.015*shim;
        col = texture2D(tDiffuse, distUv).rgb;
        col = mix(col, col+vec3(0.3,0.7,1.0)*shim, 0.6);
        col += vec3(0.6,0.9,1.0)*shim*0.3;

      // 8 — Weak: sickly desaturation + purple cast + jitter
      } else if(s < 8.5){
        float jitter = (noise(vUv*60.0+time*4.0)-0.5)*0.012;
        vec3 jitCol = texture2D(tDiffuse, vUv+jitter).rgb;
        float jlum = dot(jitCol, vec3(0.299,0.587,0.114));
        col = mix(vec3(jlum), jitCol, 0.45);
        col = mix(col, vec3(0.45,0.1,0.6), 0.25);
        col *= 0.85;

      // 9 — Frail: shattering purple cracks
      } else if(s < 9.5){
        float c1 = smoothstep(0.7,0.74,noise(vUv*18.0));
        float c2 = smoothstep(0.7,0.74,noise(vUv*12.0+vec2(3.7,1.2)));
        float crack = max(c1,c2);
        float glow = 0.4+0.6*abs(sin(time*2.0));
        col = mix(col, vec3(0.0), crack*0.8);
        col += vec3(0.6,0.1,0.9)*crack*glow*1.2;
        col = mix(col, vec3(0.55,0.1,0.75), 0.15);

      // 10 — Leech: undulating pink blobs draining upward
      } else if(s < 10.5){
        vec2 b1uv = vUv * 3.5 + vec2(sin(time*0.7+vUv.y*3.0)*0.15, -time*0.28);
        vec2 b2uv = vUv * 2.2 + vec2(cos(time*0.5+vUv.x*2.5)*0.2,  -time*0.18 + 0.4);
        float blob1 = noise(b1uv) * noise(b1uv * 1.8 + time * 0.3);
        float blob2 = noise(b2uv) * noise(b2uv * 2.3 - time * 0.4);
        float blobs = smoothstep(0.28, 0.52, blob1) + smoothstep(0.28, 0.52, blob2) * 0.7;
        blobs = min(blobs, 1.0);
        float undulate = 0.5 + 0.5 * sin(time * 2.2 + vUv.y * 6.0 + vUv.x * 4.0);
        blobs *= 0.7 + undulate * 0.3;
        vec3 blobCol = mix(vec3(1.0, 0.1, 0.6), vec3(0.5, 0.0, 0.9), blob1);
        col = mix(col, col * vec3(0.5, 0.05, 0.4), blobs * 0.55);
        col += blobCol * blobs * 0.85;
        col = mix(col, col + vec3(0.3, 0.0, 0.2), 0.2);

      // 11 — Clear: bright green cleanse flash + sparkle sweep
      } else if(s < 11.5){
        float wave = fract(time*0.6);
        float sweep = smoothstep(wave-0.05,wave,vUv.y)*smoothstep(wave+0.15,wave,vUv.y);
        float sparkle = noise(vUv*20.0+time*3.0);
        sparkle = smoothstep(0.75,0.95,sparkle)*sweep;
        float glow = sweep*0.5;
        col = mix(col, vec3(0.5,1.0,0.4)*2.0, glow+sparkle*0.8);
        col += vec3(0.3,1.0,0.5)*sparkle;

      // 12 — Purge: explosive pink radial wave
      } else {
        float radial = length(vUv-0.5)*2.0;
        float wave = sin(radial*14.0 - time*7.0);
        float ring = smoothstep(0.0,0.4,wave)*smoothstep(0.8,0.4,radial);
        float core = max(0.0,1.0-radial*1.8)*(0.5+0.5*sin(time*5.0));
        col = mix(col, vec3(1.0,0.15,0.7)*2.2, ring*0.7+core*0.5);
        col += vec3(0.8,0.0,0.5)*ring*0.4;
        float flash = max(0.0, sin(time*4.0)*0.5)*core;
        col += vec3(1.0,0.5,0.9)*flash;
      }

      // Confine effect to character pixels only
      col = mix(base.rgb, col, mask);
      gl_FragColor = vec4(col, base.a);
    }
  `,
};
const statusPass = new ShaderPass(StatusShader);
statusPass.enabled = false;

// ── Insert holo + status into composer RIGHT AFTER outline (bg is still ~#0a0a0a here) ──
composer.addPass(holoPass);
composer.addPass(statusPass);

// Status metadata: label, outline colour, base tint for color filter
const STATUS_META = [
  null,
  { label: 'Vigor',     color: 'red' },
  { label: 'Strike',    color: 'red' },
  { label: 'Burn',      color: 'orange' },
  { label: 'Corrosion', color: 'orange' },
  { label: 'Regen',     color: 'green' },
  { label: 'Block',     color: 'cyan' },
  { label: 'Reflect',   color: 'cyan' },
  { label: 'Weak',      color: 'purple' },
  { label: 'Frail',     color: 'purple' },
  { label: 'Leech',     color: 'pink' },
  { label: 'Clear',     color: 'green' },
  { label: 'Purge',     color: 'pink' },
];

// ── Loaders ──────────────────────────────────────────────────────────────────
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// ── State ────────────────────────────────────────────────────────────────────
let currentModel    = null;
let mixer           = null;
const clock         = new THREE.Clock();
let currentColorKey  = 'green';
let currentIntensity = 1.0;
let currentDesaturate = true;
let ps1Mode          = true;
let currentStatus    = 0;
let meshList         = [];

// ── Tint helpers ─────────────────────────────────────────────────────────────
// Toon gradient map: 3 bands
const gradData = new Uint8Array([0, 90, 160, 255]);
const gradTex  = new THREE.DataTexture(gradData, 4, 1, THREE.RedFormat);
gradTex.magFilter = THREE.NearestFilter;
gradTex.minFilter = THREE.NearestFilter;
gradTex.needsUpdate = true;

function tintedColor(colorKey) {
  // Lerp between neutral grey and full tint based on intensity
  const grey = new THREE.Color(0x888888);
  const full = PALETTE[colorKey].color;
  return new THREE.Color().lerpColors(grey, full, currentIntensity);
}

function applyTint(colorKey) {
  const p = PALETTE[colorKey];
  const noFilter = colorKey === 'none';

  // Outline whenever a color filter is active (toon or PS1)
  outlinePass.enabled = !noFilter;
  if (!noFilter) {
    outlinePass.visibleEdgeColor.set(p.hex);
    outlinePass.hiddenEdgeColor.set(p.hex);
  }

  meshList.forEach(mesh => {
    const orig = mesh.userData.origMat;
    if (!orig) return;

    if (ps1Mode) {
      // ── PS1 mode: flat-shaded Lambert + nearest-filter textures + vertex snap ──
      const lambert = new THREE.MeshLambertMaterial({
        flatShading: true,
        map:   orig.map || null,
        color: noFilter ? new THREE.Color(0xffffff) : tintedColor(colorKey),
      });

      if (lambert.map) {
        // Store original filters once so we can restore them later
        if (lambert.map.userData.origMagFilter === undefined) {
          lambert.map.userData.origMagFilter = lambert.map.magFilter;
          lambert.map.userData.origMinFilter  = lambert.map.minFilter;
          lambert.map.userData.origMipmaps    = lambert.map.generateMipmaps;
        }
        lambert.map.magFilter      = THREE.NearestFilter;
        lambert.map.minFilter      = THREE.NearestFilter;
        lambert.map.generateMipmaps = false;
        lambert.map.needsUpdate    = true;
      }

      // Vertex snapping + optional desaturate
      const ps1Desat = currentDesaturate;
      lambert.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader.replace(
          '#include <project_vertex>',
          `#include <project_vertex>
          float snapFactor = 185.0;
          gl_Position.xy = floor(gl_Position.xy / gl_Position.w * snapFactor + 0.5) / snapFactor * gl_Position.w;`
        );
        if (ps1Desat) {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <map_fragment>',
            `#ifdef USE_MAP
              vec4 sampledDiffuseColor = texture2D( map, vMapUv );
              float lum = dot( sampledDiffuseColor.rgb, vec3( 0.299, 0.587, 0.114 ) );
              diffuseColor *= vec4( vec3( lum ), sampledDiffuseColor.a );
            #endif`
          );
        }
      };
      lambert.customProgramCacheKey = () => `ps1-${noFilter ? 'nocolor' : 'color'}-${ps1Desat ? 'desat' : 'color'}`;

      mesh.material = lambert;

    } else if (noFilter) {
      // ── No filter, no PS1: restore original material + texture filters ──
      if (orig.map && orig.map.userData.origMagFilter !== undefined) {
        orig.map.magFilter       = orig.map.userData.origMagFilter;
        orig.map.minFilter       = orig.map.userData.origMinFilter;
        orig.map.generateMipmaps = orig.map.userData.origMipmaps;
        orig.map.needsUpdate     = true;
      }
      mesh.material = orig;

    } else {
      // ── Toon mode ──
      if (orig.map && orig.map.userData.origMagFilter !== undefined) {
        orig.map.magFilter       = orig.map.userData.origMagFilter;
        orig.map.minFilter       = orig.map.userData.origMinFilter;
        orig.map.generateMipmaps = orig.map.userData.origMipmaps;
        orig.map.needsUpdate     = true;
      }
      const toon = new THREE.MeshToonMaterial({
        map:         orig.map || null,
        gradientMap: gradTex,
        color:       tintedColor(colorKey),
      });
      if (currentDesaturate) {
        toon.onBeforeCompile = (shader) => {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <map_fragment>',
            `#ifdef USE_MAP
              vec4 sampledDiffuseColor = texture2D( map, vMapUv );
              float lum = dot( sampledDiffuseColor.rgb, vec3( 0.299, 0.587, 0.114 ) );
              diffuseColor *= vec4( vec3( lum ), sampledDiffuseColor.a );
            #endif`
          );
        };
        toon.customProgramCacheKey = () => 'desat';
      } else {
        toon.customProgramCacheKey = () => 'normal';
      }
      mesh.material = toon;
      toon.needsUpdate = true;
    }
  });

  const sidebarColor = noFilter ? '#555' : p.hex;
  document.documentElement.style.setProperty('--active-color', sidebarColor);
  const swatch = document.getElementById('swatch');
  swatch.style.background  = noFilter ? 'transparent' : p.hex;
  swatch.style.borderColor = noFilter ? '#333' : p.hex;

  // Tint the viewport background to a very dark shade of the active filter colour
  if (noFilter) {
    scene.background = new THREE.Color(0x0a0a0a);
    renderer.setClearColor(0x0a0a0a, 1);
  } else {
    const tinted = p.color.clone().multiplyScalar(0.004);
    scene.background = tinted;
    renderer.setClearColor(tinted, 1);
  }
}

// ── Load character ────────────────────────────────────────────────────────────
function loadCharacter(filepath, autoRotate = false, modelScale = 2.0) {
  loadingEl.textContent = 'LOADING…';
  loadingEl.style.display = 'flex';

  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  if (mixer)        { mixer.stopAllAction(); mixer = null; }
  meshList = [];
  outlinePass.selectedObjects = [];

  const parts = filepath.split('/');
  const url = parts.map(encodeURIComponent).join('/');

  loader.load(url, (gltf) => {
    const model = gltf.scene;
    const wrap  = new THREE.Group();
    wrap.add(model);
    scene.add(wrap);
    wrap.updateMatrixWorld(true);

    // Auto-center + scale
    const bb     = new THREE.Box3().setFromObject(wrap);
    const size   = new THREE.Vector3(); bb.getSize(size);
    const center = new THREE.Vector3(); bb.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale  = modelScale / Math.max(maxDim, 0.001);
    wrap.scale.setScalar(scale);
    wrap.position.set(-center.x * scale, -center.y * scale + (size.y * scale * 0.5), -center.z * scale);

    // Pivot for clean rotation
    const pivot = new THREE.Group();
    scene.remove(wrap);
    pivot.add(wrap);
    scene.add(pivot);
    currentModel = pivot;

    // Collect meshes + stash original materials + enable shadows
    model.traverse(node => {
      if (!node.isMesh) return;
      node.castShadow = true;
      node.receiveShadow = true;
      node.userData.origMat = node.material;
      meshList.push(node);
    });

    // Snap ground plane to the bottom of the model
    const scaledBb = new THREE.Box3().setFromObject(pivot);
    ground.position.y = scaledBb.min.y;

    outlinePass.selectedObjects = meshList;

    // Animations
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(gltf.animations[0]).play();
    }

        // Re-center camera target on the model
    const modelCenter = new THREE.Vector3();
    new THREE.Box3().setFromObject(pivot).getCenter(modelCenter);
    controls.target.copy(modelCenter);
    controls.update();

    controls.autoRotate = autoRotate;
    applyTint(currentColorKey);

    // Pre-compile shaders now to avoid first-frame stutter
    renderer.compile(scene, camera);

    loadingEl.style.display = 'none';
    nameTag.textContent = filepath.split('/').pop().replace('.glb', '');

  }, undefined, (err) => {
    console.error('Load error:', err);
    loadingEl.textContent = 'FAILED TO LOAD';
  });
}

const tabBar = document.getElementById('tabBar');
const listEl = document.getElementById('charList');

function activateTab(idx) {
  tabBar.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  listEl.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  const firstItem = listEl.querySelectorAll('.tab-panel')[idx].querySelector('.char-item');
  if (firstItem) firstItem.click();
}

GROUPS.forEach((group, idx) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn';
  btn.textContent = group.label;
  btn.addEventListener('click', () => activateTab(idx));
  tabBar.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tab-panel';

  group.sections.forEach(section => {
    // Section heading
    const head = document.createElement('div');
    head.className = 'section-head';
    head.textContent = section.heading;
    panel.appendChild(head);

    section.files.forEach((file, fi) => {
      const filepath = `${section.dir}/${file}`;
      const el = document.createElement('div');
      el.className = 'char-item';
      el.dataset.file = filepath;
      el.dataset.autoRotate = section.autoRotate ? '1' : '';
      el.dataset.scale = section.scale ?? 2.0;
      el.textContent = (section.labels && section.labels[fi]) || file
        .replace(/^.*\//, '')
        .replace('.glb', '')
        .replace(/[-_]/g, ' ')
        .replace(/^item /i, '')
        .replace(/\bmaimed\b/gi, '')
        .replace(/\bwalking\b/gi, '')
        .replace(/\s+/g, ' ')
        .trim();
      el.addEventListener('click', () => {
        document.querySelectorAll('.char-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        loadCharacter(filepath, section.autoRotate ?? false, section.scale ?? 2.0);
      });
      panel.appendChild(el);
    });
  });

  listEl.appendChild(panel);
});

document.getElementById('holoToggle').addEventListener('change', e => {
  holoPass.enabled = e.target.checked;
  document.getElementById('holoWrap').classList.toggle('active', e.target.checked);
});

document.getElementById('statusPicker').addEventListener('change', e => {
  currentStatus = parseInt(e.target.value);
  statusPass.uniforms.status.value = currentStatus;
  statusPass.enabled = currentStatus > 0;

  if (currentStatus > 0) {
    const meta = STATUS_META[currentStatus];
    currentColorKey = meta.color;
    document.getElementById('colorPicker').value = meta.color;
    applyTint(meta.color);
    const p = PALETTE[meta.color];
    if (p.color) holoPass.uniforms.holoColor.value.copy(p.color);
  }
});

document.getElementById('brightness').addEventListener('input', e => {
  brightnessPass.uniforms.brightness.value = parseFloat(e.target.value) / 100;
});

const ZOOM_STEP = 0.15;
document.getElementById('zoomIn').addEventListener('click', () => {
  camera.position.lerp(controls.target, ZOOM_STEP);
  controls.update();
});
document.getElementById('zoomOut').addEventListener('click', () => {
  const dir = camera.position.clone().sub(controls.target).multiplyScalar(1 + ZOOM_STEP);
  camera.position.copy(controls.target).add(dir);
  controls.update();
});

// Init swatch + PS1 default state
document.getElementById('ps1Toggle').checked = true;
document.getElementById('ps1Wrap').classList.add('active');
applyTint(currentColorKey);

// ── Resize ───────────────────────────────────────────────────────────────────
function resize() {
  const vp = document.getElementById('viewport');
  const w = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  outlinePass.resolution.set(w, h);
  const pr = renderer.getPixelRatio();
  pixelPass.uniforms.resolution.value.set(w * pr, h * pr);
}
new ResizeObserver(resize).observe(document.getElementById('viewport'));
resize();

// ── Render loop ──────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  controls.update();

  const elapsed = clock.getElapsedTime();
  if (holoPass.enabled)  holoPass.uniforms.time.value   = elapsed;
  if (currentStatus > 0) statusPass.uniforms.time.value = elapsed;

  composer.render();
}
animate();
</script>
</body>
</html>
