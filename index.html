<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moongleam — Character Viewer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 20px;
      background: #111;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    select {
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #333;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: #555; }

    .intensity-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 80px;
      height: 3px;
      background: #333;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
      cursor: pointer;
    }

    .zoom-wrap {
      display: flex;
      gap: 4px;
    }

    .zoom-wrap button {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      width: 26px;
      height: 26px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.1s, border-color 0.1s;
    }

    .zoom-wrap button:hover { color: #ccc; border-color: #555; }
    .zoom-wrap button:active { background: #222; }

    .desat-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      user-select: none;
    }
    .desat-wrap:hover { color: #888; }
    .desat-wrap input[type=checkbox] {
      accent-color: #888;
      cursor: pointer;
    }

    .ps1-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      user-select: none;
      padding-left: 10px;
      border-left: 1px solid #222;
    }
    .ps1-wrap:hover { color: #888; }
    .ps1-wrap.active { color: #ff9944; }
    .ps1-wrap input[type=checkbox] {
      accent-color: #ff9944;
      cursor: pointer;
    }

    .holo-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      cursor: pointer;
      user-select: none;
      padding-left: 10px;
      border-left: 1px solid #222;
    }
    .holo-wrap:hover { color: #888; }
    .holo-wrap.active { color: #44ddff; }
    .holo-wrap input[type=checkbox] {
      accent-color: #44ddff;
      cursor: pointer;
    }

    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid #444;
      flex-shrink: 0;
    }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    aside {
      width: 200px;
      background: #0f0f0f;
      border-right: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    #charList {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      background: #1a1a1a;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1 1 auto;
      padding: 7px 4px;
      font-family: inherit;
      font-size: 8px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #666;
      background: #0f0f0f;
      border: none;
      cursor: pointer;
      transition: color 0.1s, background 0.1s;
      white-space: nowrap;
    }

    .tab-btn:hover { color: #aaa; background: #141414; }
    .tab-btn.active { color: var(--active-color, #44ff88); background: #111; }

    .tab-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .tab-panel.active { display: block; }
    .tab-panel::-webkit-scrollbar { width: 4px; }
    .tab-panel::-webkit-scrollbar-track { background: #0f0f0f; }
    .tab-panel::-webkit-scrollbar-thumb { background: #2a2a2a; }

    .char-item {
      padding: 9px 14px;
      font-size: 11px;
      color: #555;
      cursor: pointer;
      border-bottom: 1px solid #161616;
      transition: color 0.1s, background 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .char-item { color: #777; }
    .char-item:hover { background: #161616; color: #aaa; }
    .char-item.active { color: var(--active-color, #44ff88); background: #141414; }

    .section-head {
      padding: 10px 14px 4px;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #3a3a3a;
      margin-top: 2px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .section-head:first-child { margin-top: 0; }
    .section-head::after {
      content: '▼';
      position: absolute;
      right: 14px;
      font-size: 6px;
      transition: transform 0.2s;
    }
    .section-head.collapsed::after {
      transform: rotate(-90deg);
    }
    .section-content {
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .section-content.collapsed {
      max-height: 0 !important;
    }

    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #444;
      pointer-events: none;
    }

    #model-name {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #333;
      pointer-events: none;
    }

    #animPicker {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
    }
    #animPicker:hover { color: #44ddff; border-color: #44ddff; }
    #animPicker:focus { border-color: #555; }

    /* Battle mode */
    #battlePanel { display: none; padding: 14px; flex-direction: column; gap: 18px; }
    #battlePanel.active { display: flex; }
    #battleSeqBtn {
      background: #1a1a1a; color: #888; border: 1px solid #333; padding: 9px;
      font-family: inherit; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; transition: color 0.12s, border-color 0.12s;
    }
    #battleSeqBtn:hover { color: #44ff88; border-color: #44ff88; }
    #battleSeqBtn.active { color: #ff5555; border-color: #ff5555; }
    .battle-slot { display: flex; flex-direction: column; gap: 6px; }
    .battle-slot-label {
      font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #44ff88;
    }
    .battle-slot select {
      background: #1a1a1a; color: #ccc; border: 1px solid #333;
      padding: 6px 8px; font-family: inherit; font-size: 11px; outline: none; cursor: pointer;
    }
    .battle-slot select:focus { border-color: #555; }
    #battleControls {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: none; gap: 6px;
    }
    #battleControls.active { display: flex; }
    /* Battle portrait frames (game-UI VS cards) */
    #battleStage {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; gap: 48px;
      pointer-events: none;
    }
    #battleStage.active { display: flex; }
    .fighter-frame {
      /* size set in JS (layoutFrames): 3:4 portrait, scaled to fit.
         Background = themed colour; the canvas is inset 2px so this shows as a
         border that FOLLOWS the chamfered corners (a real CSS border would be
         clipped away on the diagonals). */
      position: relative;
      background: var(--active-color, #44ff88);
      box-shadow: 0 0 18px -6px var(--active-color, #44ff88);
      flex: 0 0 auto;
    }
    .fighter-frame canvas {
      display: block; position: absolute; top: 2px; left: 2px;
      width: calc(100% - 4px); height: calc(100% - 4px);  /* fill, inset 2px on ALL sides → full border */
    }
    /* Chamfered cutout corners — left frame: top-left + bottom-right; right: top-right + bottom-left.
       Outer (frame) chamfer 18px; inner (canvas) chamfer 16px → 2px themed diagonal border. */
    /* Each frame + its below-frame refresh button stack in a column;
       the column aligns the button to the frame's outer-bottom corner. */
    .fighter-col { display: flex; flex-direction: column; }
    #battleStage .fighter-col:first-child { align-items: flex-start; }   /* button under bottom-LEFT */
    #battleStage .fighter-col:last-child  { align-items: flex-end; }     /* button under bottom-RIGHT */
    #battleStage .fighter-col:first-child .fighter-frame {
      clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    }
    #battleStage .fighter-col:last-child .fighter-frame {
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    }
    #battleStage .fighter-col:first-child .fighter-frame canvas {
      clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    }
    #battleStage .fighter-col:last-child .fighter-frame canvas {
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }
    /* Fixed re-roll button below each frame — position never shifts with chip count */
    .frame-refresh {
      margin-top: 8px; padding: 4px; color: #ccc; cursor: pointer;
      background: rgba(0,0,0,0.45); border: 1px solid currentColor; border-radius: 2px;
      pointer-events: auto; opacity: 0.5; transition: opacity 0.12s; display: none;
    }
    .frame-refresh:hover { opacity: 1; }
    .frame-refresh svg { display: block; }
    /* ── Multi-status badges + roll button ── */
    .status-chip {
      display: inline-block; padding: 2px 6px; margin: 2px;
      font-family: inherit; font-size: 9px; letter-spacing: 0.1em; font-weight: bold;
      border: 1px solid currentColor; border-radius: 2px; background: rgba(0,0,0,0.45);
      text-transform: uppercase; line-height: 1.2;
    }
    .status-chip.glyph { padding: 3px; vertical-align: middle; }
    .status-chip.glyph svg { display: block; }
    /* Inline re-roll button — chip-styled, half opacity, full on hover */
    .status-refresh {
      vertical-align: middle; padding: 3px; color: #ccc; cursor: pointer;
      pointer-events: auto; opacity: 0.5; transition: opacity 0.12s;
    }
    .status-refresh:hover { opacity: 1; }
    .status-refresh svg { display: block; }
    #statusBadges {
      position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
      display: none; text-align: center; pointer-events: none; z-index: 5; max-width: 80%;
    }
    .frame-badges {
      position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
      pointer-events: none; z-index: 5; display: none;
    }
    /* Retro-TV horizontal scanlines over each frame (inset to keep the border clean) */
    .fighter-frame::after {
      content: ''; position: absolute; inset: 2px; pointer-events: none;
      background: repeating-linear-gradient(0deg,
        rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
    }
    #battleControls button {
      background: #1a1a1a; color: #888; border: 1px solid #333;
      padding: 7px 11px; font-family: inherit; font-size: 9px; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer; transition: color 0.12s, border-color 0.12s;
    }
    #battleControls button:hover { color: #44ddff; border-color: #44ddff; }
    #battleControls button.active { color: #44ff88; border-color: #44ff88; }

    #viewerControls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    #downloadBtn, #poseBtn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    #downloadBtn:hover, #poseBtn:hover { color: #44ff88; border-color: #44ff88; background: #141414; }
    #downloadBtn:active, #poseBtn:active { background: #222; }
    #downloadBtn:disabled, #poseBtn:disabled { opacity: 0.4; cursor: default; color: #555; border-color: #2a2a2a; }
    #downloadBtn:disabled:hover, #poseBtn:disabled:hover { color: #555; border-color: #2a2a2a; background: #1a1a1a; }
    #downloadBtn .dl-arrow, #poseBtn .dl-arrow { font-size: 13px; line-height: 1; }
    /* Active (animation stopped) state */
    #poseBtn.active { color: #44ff88; border-color: #44ff88; }
  </style>
</head>
<body>

<header>
  <h1>Moongleam // Characters</h1>
  <div class="controls">
    <label>Filter</label>
    <div class="color-swatch" id="swatch"></div>
    <select id="colorPicker">
      <option value="none">No Filter</option>
      <option value="green" selected>Green</option>
      <option value="cyan">Cyan</option>
      <option value="orange">Orange</option>
      <option value="pink">Pink</option>
      <option value="purple">Purple</option>
      <option value="red">Red</option>
    </select>
    <div class="intensity-wrap">
      <label>Brightness</label>
      <input type="range" id="brightness" min="20" max="390" value="253" />
    </div>
    <label class="desat-wrap">
      <input type="checkbox" id="desaturate" checked />
      Desaturate
    </label>
    <label class="ps1-wrap" id="ps1Wrap">
      <input type="checkbox" id="ps1Toggle" />
      PS1
    </label>
    <label class="holo-wrap" id="holoWrap">
      <input type="checkbox" id="holoToggle" />
      Holo
    </label>
    <div class="intensity-wrap" style="padding-left:10px;border-left:1px solid #222;">
      <label>Status</label>
      <select id="statusPicker">
        <option value="0">— None —</option>
        <option value="1">Vigor</option>
        <option value="2">Strike</option>
        <option value="3">Burn</option>
        <option value="4">Corrosion</option>
        <option value="5">Regen</option>
        <option value="6">Block</option>
        <option value="7">Reflect</option>
        <option value="8">Weak</option>
        <option value="9">Frail</option>
        <option value="10">Leech</option>
        <option value="11">Clear</option>
        <option value="12">Purge</option>
      </select>
    </div>
    <label class="holo-wrap" id="multiWrap">
      <input type="checkbox" id="multiToggle" />
      Multi-Status
    </label>
    <div class="zoom-wrap">
      <button id="zoomOut">−</button>
      <button id="zoomIn">+</button>
    </div>
  </div>
</header>

<main>
  <aside>
    <div class="tab-bar" id="tabBar"></div>
    <div id="charList"></div>
    <div id="battlePanel">
      <button id="battleSeqBtn">BATTLE: OFF</button>
      <div class="battle-slot">
        <div class="battle-slot-label">Fighter A</div>
        <select id="slotAChar"></select>
        <select id="slotAAnim"></select>
        <select id="slotAStatus"></select>
      </div>
      <div class="battle-slot">
        <div class="battle-slot-label">Fighter B</div>
        <select id="slotBChar"></select>
        <select id="slotBAnim"></select>
        <select id="slotBStatus"></select>
      </div>
    </div>
  </aside>
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div id="battleStage">
      <div class="fighter-col">
        <div class="fighter-frame"><canvas id="frameCanvasA"></canvas><div class="frame-badges" id="badgesA"></div></div>
        <button class="frame-refresh" data-scope="A" title="Re-roll statuses"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg></button>
      </div>
      <div class="fighter-col">
        <div class="fighter-frame"><canvas id="frameCanvasB"></canvas><div class="frame-badges" id="badgesB"></div></div>
        <button class="frame-refresh" data-scope="B" title="Re-roll statuses"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg></button>
      </div>
    </div>
    <div id="statusBadges"></div>
    <div id="loading">SELECT A CHARACTER</div>
    <select id="animPicker" title="Animation"></select>
    <div id="battleControls">
      <button data-preset="front">Front</button>
      <button data-preset="profile">Profile</button>
      <button data-preset="angled">Zoomed</button>
      <button data-preset="pokemon">Pokemon</button>
    </div>
    <div id="model-name"></div>
    <div id="viewerControls">
      <button id="poseBtn" title="Stop the walking animation">
        <span class="dl-arrow">⏸</span> STAND STILL
      </button>
      <button id="downloadBtn" title="Download rigged GLB">
        <span class="dl-arrow">↓</span> DOWNLOAD GLB
      </button>
    </div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }   from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass }    from 'three/addons/postprocessing/OutlinePass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';

// ── Palette ──────────────────────────────────────────────────────────────────
const PALETTE = {
  none:   { hex: null,      color: null },
  green:  { hex: '#44ff88', color: new THREE.Color(0x44ff88) },
  cyan:   { hex: '#00ffe0', color: new THREE.Color(0x00ffe0) },
  orange: { hex: '#ff8800', color: new THREE.Color(0xff8800) },
  pink:   { hex: '#ff44cc', color: new THREE.Color(0xff44cc) },
  purple: { hex: '#aa44ff', color: new THREE.Color(0xaa44ff) },
  red:    { hex: '#ff3333', color: new THREE.Color(0xff3333) },
};

const GROUPS = [
  { label: 'Round 1', sections: [
    { heading: 'Elite', dir: 'models', scale: 1.63, autoRotate: false, collapsed: false, files: [
      'Green Female.glb',
      'Maimed-Green-Male-Walking.glb',
      'Maimed-Orange-Female-Walking.glb',
      'Maimed-Orange-Male-Walking.glb',
  ]},
    { heading: 'Bosses', dir: 'models', scale: 1.63, autoRotate: false, collapsed: false, files: [
      'Maimed-Pink-Female-Walking.glb',
      'Maimed-Pink-Male-Walking.glb',
      'Maimed-Purple-Female-Walking.glb',
      'Maimed-Purple-Male-Walking.glb',
      'Maimed-Red-Female-Walking.glb',
      'Maimed-Red-Male-Walking.glb',
    ]},
    { heading: 'Base Characters', dir: 'models', scale: 1.63, autoRotate: false, collapsed: false, files: [
      'Base Female Orange V2.glb',
      'Tactical Female Black.glb',
      'enemies/Base Male 1.glb',
      'enemies/Base Female 1.glb',
      'enemies/Base Male 2.glb',
      'enemies/Base Female 2.glb',
      'enemies/Base Male 3.glb',
      'enemies/Base Female 3.glb',
      'enemies/Base Male 4.glb',
      'enemies/Base Female 4.glb',
      'orange_male_base_walking.glb',
      'orange_female_base_walking.glb',
      'base_alt_female_blue_walking.glb',
      'base_alt_male_blue_walking.glb',
      'base_alt_male_green_walking.glb',

      vec2 blockCoord = dxy * floor(vUv / dxy);

// Background colour as vec3 for mask detection in shaders
// mask = how much a pixel differs from the scene bg (#0a0a0a)
// Used by holo + status shaders to confine effects to the character

// ── Hologram pass ────────────────────────────────────────────────────────────
const HoloShader = {
  uniforms: {
    tDiffuse:   { value: null },
    time:       { value: 0.0 },
    holoColor:  { value: new THREE.Color(0x40d8ff) }, // iconic holographic cyan
    resolution: { value: new THREE.Vector2(800, 600) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform vec3 holoColor;
    uniform vec2 resolution;
    varying vec2 vUv;

    float hash(float n){ return fract(sin(n)*43758.5453); }

    // Raw silhouette difference from the background colour (un-thresholded).
    float diffAt(vec2 uv, vec3 bgCol){
      return length(texture2D(tDiffuse, uv).rgb - bgCol);
    }

    void main(){
      const vec3 LW = vec3(0.299, 0.587, 0.114);
      // Background reference: average the TOP corners (stay background even when
      // the figure is zoomed in / fills the lower frame — bottom corners can land
      // on a limb, which would invert the mask and cause intense flashing).
      vec3 bgCol = (texture2D(tDiffuse, vec2(0.03, 0.97)).rgb + texture2D(tDiffuse, vec2(0.97, 0.97)).rgb) * 0.5;
      float bgLum = dot(bgCol, LW);
      vec4 baseRaw = texture2D(tDiffuse, vUv);

      // ── Soft silhouette mask ──────────────────────────────────────────────
      // Heavily blur the background-difference (9-tap) so the INTERIOR mask is
      // smooth and uniform — this is what kills the bright speckle on busy models
      // (the per-pixel alpha noise came from the mask swinging between bright gear
      // and dark crevices). Face/feature detail is NOT lost: it comes from the
      // colour shading below, not the mask. The blur also keeps edges soft.
      // Wide 13-tap blur (radii ~5px & ~9px, well past the 4.5px PS1 blocks) so
      // scattered bright highlights average into the surrounding cloth instead of
      // surviving as opaque speckle dots.
      float ra = 5.0 / resolution.x, rb = 5.0 / resolution.y;
      float rc = 9.0 / resolution.x, rd = 9.0 / resolution.y;
      float diff = diffAt(vUv, bgCol) * 0.16
        + ( diffAt(vUv + vec2(ra, 0.0), bgCol) + diffAt(vUv - vec2(ra, 0.0), bgCol)
          + diffAt(vUv + vec2(0.0, rb), bgCol) + diffAt(vUv - vec2(0.0, rb), bgCol) ) * 0.11
        + ( diffAt(vUv + vec2(ra,  rb), bgCol) + diffAt(vUv - vec2(ra, rb), bgCol)
          + diffAt(vUv + vec2(ra, -rb), bgCol) + diffAt(vUv + vec2(-ra, rb), bgCol) ) * 0.06
        + ( diffAt(vUv + vec2(rc, 0.0), bgCol) + diffAt(vUv - vec2(rc, 0.0), bgCol)
          + diffAt(vUv + vec2(0.0, rd), bgCol) + diffAt(vUv - vec2(0.0, rd), bgCol) ) * 0.04;
      // Wider ramp → the silhouette edge is a smooth gradient, not a noisy
      // near-binary boundary (that boundary wobble was the edge static). The
      // hole-fill below forces the interior solid, so edge glow still won't fire
      // inside — only at this soft outer ramp.
      float mask = smoothstep(0.006, 0.05, diff);

      // Fill interior holes (dark crevices that survive the blur). A pixel
      // enclosed by figure on BOTH axes is interior → set solid, so neither the
      // edge glow nor the alpha speckles inside. Open gaps (legs) stay open.
      float gx = 7.0 / resolution.x, gy = 7.0 / resolution.y;
      float encH = min(smoothstep(0.008, 0.022, diffAt(vUv - vec2(gx, 0.0), bgCol)),
                       smoothstep(0.008, 0.022, diffAt(vUv + vec2(gx, 0.0), bgCol)));
      float encV = min(smoothstep(0.008, 0.022, diffAt(vUv - vec2(0.0, gy), bgCol)),
                       smoothstep(0.008, 0.022, diffAt(vUv + vec2(0.0, gy), bgCol)));
      mask = max(mask, min(encH, encV));

      // ── Horizontal glitch bands ── (slower + far fewer → less distracting)
      float bandRow  = floor(vUv.y * 80.0);
      float bandTime = floor(time * 5.0);
      float trigger  = hash(bandRow * 127.1 + bandTime * 311.7);
      float isGlitch = step(0.93, trigger) * mask;
      float glitchAmt = (hash(bandRow * 92.3 + bandTime * 17.0) - 0.5) * 0.18 * isGlitch;

      // ── Large tear / full-row displacement ── (rare)
      float tearRow  = floor(vUv.y * 20.0);
      float tearTime = floor(time * 2.5);
      float tearTrig = step(0.97, hash(tearRow * 53.1 + tearTime * 79.3)) * mask;
      float tearAmt  = (hash(tearRow + tearTime) - 0.5) * 0.28 * tearTrig;

      // ── Chromatic aberration on glitch ──
      float aberr = (glitchAmt + tearAmt) * 0.4;
      vec2 uv = vec2(vUv.x + glitchAmt + tearAmt, vUv.y);
      float lumR = dot(texture2D(tDiffuse, uv + vec2( aberr, 0.0)).rgb, LW);
      float lumG = dot(texture2D(tDiffuse, uv).rgb,                     LW);
      float lumB = dot(texture2D(tDiffuse, uv - vec2( aberr, 0.0)).rgb, LW);

      // ── Internal surface detail, normalised 0..1 within the figure ──
      // Sampled crisp (no blur) so interior features stay sharp.
      float detail = clamp((lumG - bgLum) / max(1.0 - bgLum, 0.001), 0.0, 1.0);

      // ── Scanlines — low frequency so they survive the upstream pixelation ──
      // Gaps drop toward 0 (see-through); lines stay bright. Sharp, even bands.
      float scan = 0.5 + 0.5 * sin(vUv.y * 130.0 - time * 5.0);
      scan = smoothstep(0.35, 0.75, scan);

      // ── Instability: rolling wave + per-row flicker (slower, gentler) ──
      float roll       = 0.92 + 0.08 * sin(vUv.y * 4.0 - time * 2.2);
      float flicker    = 0.94 + 0.06 * hash(floor(time * 9.0));
      float bigFlicker = step(0.985, hash(floor(time * 4.0))) * 0.25;  // rare dropout
      float instab     = roll * flicker * (1.0 - bigFlicker);

      // ── Global flicker: whole projection pulses (slower, subtler) ──
      float gFlick = 0.86 + 0.14 * hash(floor(time * 12.0));
      gFlick *= 1.0 - step(0.96, hash(floor(time * 6.0) + 7.0)) * 0.3;  // rare brief dropout
      gFlick  = mix(1.0, gFlick, 0.6);             // subtle, never strobes

      // ── Opacity: uniform translucency across the whole figure ──
      // No bar-led selective transparency, no edge/Fresnel outline.
      float alpha = mask * 0.85 * (0.9 + 0.1 * scan);
      alpha *= instab * gFlick;
      alpha = clamp(alpha, 0.0, 1.0);

      // ── Holographic emission colour (single hue + chromatic fringe) ──
      // Asymmetric curve: pow() deepens the darks (high contrast on interior
      // shadows/eyes/mouth) while the ceiling stays compressed so bright
      // highlights don't blow out.
      float dShape = pow(detail, 1.5);
      float shade = mix(0.20, 1.25, dShape);
      vec3 holo = holoColor * shade;
      holo.r += (lumR - lumG) * 0.22;              // subtle chromatic fringe
      holo.b += (lumB - lumG) * 0.22;

      // ── Thin, quick scan bar sweeping upward, looping (brightness only) ──
      // float scanBarPos = fract(time * 0.26);                       // brisk upward loop
      // float scanBar    = smoothstep(0.022, 0.0, abs(vUv.y - scanBarPos)); // thin band
      // holo += holoColor * scanBar * 0.8;           // brighten its hue as it passes
      holo = max(holo, 0.0);

      // ── Composite: fade between background and the ghost ──
      // float a = clamp(alpha + scanBar * mask * 0.12, 0.0, 1.0); // slight solidify on the bar
      vec3 col = mix(bgCol, holo, alpha);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
};
const holoPass = new ShaderPass(HoloShader);
holoPass.enabled = false;

function makeLucideTexture(svgPath, size = 128) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = 'white';
  ctx.save();
  ctx.scale(size / 24, size / 24);
  ctx.fill(new Path2D(svgPath));
  ctx.restore();
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}
const LUCIDE_SHIELD = 'M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z';
const LUCIDE_FLAME  = 'M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4';

// Skull (acid/corrosion) — filled silhouette with eyes + nose punched out via evenodd
function makeSkullTexture(size = 128) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, size, size);
  ctx.save();
  ctx.scale(size / 24, size / 24);
  const p = new Path2D();
  // Lucide "skull" head + jaw outline
  p.addPath(new Path2D('M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z'));
  // Eye sockets (holes, enlarged so they read at small size)
  p.moveTo(16.6, 12); p.arc(15, 12, 1.6, 0, Math.PI * 2);
  p.moveTo(10.6, 12); p.arc(9,  12, 1.6, 0, Math.PI * 2);
  // Nose cavity (hole)
  p.addPath(new Path2D('M12 14.4 13 16.6 11 16.6 z'));
  ctx.fillStyle = 'white';
  ctx.fill(p, 'evenodd');
  ctx.restore();
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

const StatusShader = {
  uniforms: {
    tDiffuse:   { value: null },
    time:       { value: 0.0 },
    status:     { value: 0.0 },
    resolution: { value: new THREE.Vector2(800, 600) },
    shieldIcon: { value: shieldIconTex },
    flameIcon:  { value: flameIconTex },
    skullIcon:  { value: skullIconTex },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform float status;
    uniform vec2 resolution;
    uniform sampler2D shieldIcon;
    uniform sampler2D flameIcon;
    uniform sampler2D skullIcon;
    varying vec2 vUv;

    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float hash1(float n){ return fract(sin(n)*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p); vec2 f=fract(p);
      float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
      vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
    }

    // Detect whether a UV point is a character pixel
    float isChar(vec2 uv, vec3 bgCol){
      return smoothstep(0.04, 0.16, length(texture2D(tDiffuse, uv).rgb - bgCol));
    }

    // IQ two-pass Voronoi border distance — uniform-width crack lines
    vec2 hash2v(vec2 p){
      vec2 q = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
      return fract(sin(q)*43758.5453);
    }
    float voronoiBorder(vec2 x){
      vec2 p = floor(x);
      vec2 f = fract(x);
      vec2 mr, mb2;
      float res = 8.0;
      // Pass 1: find closest seed
      for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
        vec2 b = vec2(float(i),float(j));
        vec2 r = b + hash2v(p+b) - f;
        float d = dot(r,r);
        if(d<res){ res=d; mr=r; mb2=b; }
      }
      // Pass 2: true perpendicular distance to each boundary
      res = 8.0;
      for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){

        vec2 r = b + hash2v(p+b) - f;

    // FBM noise for warping Voronoi UVs
    float fbm2(vec2 p){
      float s=0.0; float a=0.5;
      for(int i=0;i<4;i++){ s+=a*noise(p); p*=2.0; a*=0.5; }
      return s;
    }
    // Multi-scale Voronoi cracks: angular hairlines with FBM warp
    float crackLines(vec2 uv, float baseScale, float spread){
      // Organic warp so cells aren't perfectly regular
      vec2 warped = uv + vec2(fbm2(uv*2.0+spread), fbm2(uv*2.0+spread+5.2)) * 0.18;
      float cracks = 0.0;
      float scale = baseScale;
      float width = 0.038;
      for(int i=0;i<4;i++){
        float d = voronoiBorder(warped * scale);
        float aa = fwidth(d);
        cracks = max(cracks, 1.0 - smoothstep(width-aa, width+aa, d));
        scale *= 1.85;
        width *= 0.48; // finer hairlines at higher frequency
      }
      return cracks;
    }

    // Returns 1 if within ~haloR pixels of the character silhouette
    float nearCharacter(vec2 uv, vec3 bgCol, float haloR){
      float px = haloR / resolution.x;
      float py = haloR / resolution.y;
      float near = isChar(uv, bgCol);
      for(int i = 0; i < 8; i++){
        float a = float(i) * 6.28318 / 8.0;
        near = max(near, isChar(uv + vec2(cos(a)*px, sin(a)*py), bgCol));
      }
      return near;
    }

    // Sample a ring of N points at given radius and return max bg-proximity
    float ringNearBg(vec2 uv, vec3 bgCol, float r, int n){
      float px = r / resolution.x;
      float py = r / resolution.y;
      float nearBg = 0.0;
      for(int i = 0; i < 12; i++){
        if(i >= n) break;
        float a = float(i) * 6.28318 / float(n);
        vec2 off = vec2(cos(a)*px, sin(a)*py);
        nearBg = max(nearBg, 1.0 - isChar(uv + off, bgCol));
      }
      return nearBg;
    }

    void main(){
      vec4 base = texture2D(tDiffuse, vUv);
      if(status < 0.5){ gl_FragColor = base; return; }

      vec3 bgCol = (texture2D(tDiffuse, vec2(0.03, 0.97)).rgb + texture2D(tDiffuse, vec2(0.97, 0.97)).rgb) * 0.5;
      float s = status;
      float px = 1.0 / resolution.x;
      float py = 1.0 / resolution.y;

      // ── Per-status: warp UV for wavy outlines, set thickness + color ──
      vec2 warpedUv = vUv;
      float radius = 3.0;
      vec3 outlineCol = vec3(1.0);
      float brightness = 1.0;
      int   samples = 8;
      // Surface overlay (for effects that go over the model, not just outline)
      vec3  extraCol  = vec3(0.0);
      float extraMask = 0.0;

      if(s < 1.5){
        // Vigor: heartbeat — outline pulses red, thickness slams on beat (50% slower)
        float t = mod(time * 0.65, 1.0);
        float beat = exp(-pow((t-0.08)*28.0,2.0)) + exp(-pow((t-0.22)*38.0,2.0))*0.7;
        radius = 2.5 + beat * 6.0;
        outlineCol = mix(vec3(0.8,0.05,0.05), vec3(1.0,0.3,0.1), beat);
        brightness = 0.7 + beat * 0.8;

      } else if(s < 2.5){
        // Strike: electric blue/white — toned down
        float row = floor(vUv.y * resolution.y / 3.0);
        float jitterX = (hash(vec2(row, floor(time*14.0))) - 0.5) * 0.007;
        warpedUv.x += jitterX;
        float spark = hash1(floor(time*18.0));
        radius = 1.5 + spark * 3.0;
        outlineCol = mix(vec3(0.3,0.7,1.0), vec3(0.8,0.95,1.0), spark);
        brightness = 0.9 + spark * 0.7;

      } else if(s < 3.5){
        // Burn: animated outline only (no doubled warp), + flame sprites rising slowly
        float f1 = noise(vec2(vUv.x * 6.0,  time * 5.0 - vUv.y * 3.0));
        float f2 = noise(vec2(vUv.x * 11.0, time * 8.0 - vUv.y * 5.0 + 1.7));
        float flameshape = f1 * 0.6 + f2 * 0.4;
        // Only horizontal twist — no vertical warp that creates double outline
        float twist = sin(vUv.x * 7.0 + time * 6.0) * 0.012 + sin(vUv.x*18.0+time*11.0)*0.004;
        warpedUv.x += twist;
        float spikeMult = 1.0 - clamp(vUv.y * 1.2 - 0.1, 0.0, 1.0);
        radius = 1.5 + flameshape * 8.0 * (0.5 + spikeMult * 0.5);
        float fireT = clamp(1.0 - vUv.y * 1.3, 0.0, 1.0);
        float flicker = 0.55 + 0.45*sin(time*21.0)*sin(time*8.3+vUv.x*5.0);
        outlineCol = mix(vec3(1.0,0.9,0.0), vec3(1.0,0.15,0.0), fireT);
        outlineCol = mix(outlineCol, vec3(1.0,1.0,0.6), f2 * flameshape * 0.5);
        brightness = (1.2 + flicker * 0.8) * 1.5;
        samples = 10;
        // Flame icon sprites — slower, teardrop-shaped, with red→orange→yellow gradient
        {
          float aspect = resolution.x / resolution.y;
          float cellSz = 0.21;
          // Soft halo: full intensity within 40px, fades to ~25% at 85px
          float hNear = nearCharacter(vUv, bgCol, 40.0);
          float hFar  = nearCharacter(vUv, bgCol, 85.0);
          float halo  = hFar * (0.25 + 0.75 * hNear);
          for(int gx = -1; gx <= 2; gx++){
            for(int gy = -2; gy <= 3; gy++){
              vec2 cellId = floor(vec2(vUv.x * aspect, vUv.y) / cellSz) + vec2(float(gx), float(gy));
              float rx = 0.2 + hash(cellId) * 0.6;
              float ry = 0.2 + hash(cellId + vec2(23.5, 67.2)) * 0.6;
              float spd = 0.11 + hash(cellId + vec2(7.0)) * 0.08; // slower
              vec2 fcenter;
              fcenter.x = (cellId.x + rx) * cellSz / aspect;
              fcenter.y = fract((cellId.y + ry) * cellSz + time * spd);
              float lifeFade = smoothstep(0.0, 0.14, fcenter.y) * smoothstep(1.05, 0.62, fcenter.y);
              float wiggle = sin(time * 7.0 + hash(cellId) * 6.28 + fcenter.y * 12.0) * 0.011;
              vec2 fd = vec2((vUv.x - fcenter.x + wiggle) * aspect, vUv.y - fcenter.y);
              float fgate = sqrt(lifeFade * halo); // scale size → shrinks to nothing outside aura
              float fsz = (0.025 + hash(cellId + vec2(1.3)) * 0.013) * 1.70 * fgate;
              // Lucide flame icon sampled from real SVG path texture
              vec2 flameUV = fd / (max(fsz, 0.0001) * 2.4) + 0.5;
              float flSample = (flameUV.x > 0.0 && flameUV.x < 1.0 && flameUV.y > 0.0 && flameUV.y < 1.0)
                ? texture2D(flameIcon, flameUV).r : 0.0;
              float fdist = step(0.5, flSample) > 0.5 ? -1.0 : 1.0;
              float falpha = step(0.0, -fdist); // binary — no fractional mask, no bleed-through
              // Red (base, low y) → orange → yellow (tip, high y)
              float fgrad = clamp((fd.y + fsz * 0.5) / max(fsz * 2.2, 0.0001), 0.0, 1.0);
              vec3 fCol = mix(vec3(1.0, 0.02, 0.0), mix(vec3(1.0,0.5,0.0), vec3(1.0,0.92,0.0), fgrad*2.0-0.5), fgrad);
              float fflicker = 0.68 + 0.32 * sin(time * 14.0 + hash(cellId) * 6.28);
              extraCol  = mix(extraCol, fCol * fflicker, falpha);
              extraMask = max(extraMask, falpha); // binary — size=0 outside aura so falpha=0 there
            }
          }
        }

      } else if(s < 4.5){
        // Corrosion: sinusoidal undulating outline scrolling downward, acid cyan/green
        // Two sine waves moving downward at different speeds for organic undulation
        float sineA = sin(vUv.y * 8.0 - time * 2.2) * 0.022;
        float sineB = sin(vUv.y * 13.0 - time * 3.5 + 1.8) * 0.011;
        warpedUv.x += sineA + sineB;
        // Slight drip downward
        float drip = noise(vec2(vUv.x * 5.0, time * 0.9)) * 0.010;
        warpedUv.y += drip;
        // Radius pulses with the sine wave for thickness variation
        float wavePhase = sin(vUv.y * 8.0 - time * 2.2);
        radius = 2.5 + wavePhase * 1.8 + noise(vec2(vUv.x*8.0, vUv.y*8.0+time*1.5)) * 1.5;
        float caustic = 0.5 + 0.5*sin(time*7.0 + vUv.x*18.0 + vUv.y*12.0);
        outlineCol = mix(vec3(0.0,1.0,0.7), vec3(0.1,0.95,0.3), caustic); // cyan→acid green
        outlineCol = mix(outlineCol, vec3(0.5,1.0,0.95), caustic * 0.3);
        brightness = 1.5 + caustic * 0.5;
        samples = 10;
        // Skull icon sprites drifting upward (like burn flames) — acid green
        {
          float aspect = resolution.x / resolution.y;
          float cellSz = 0.22;
          float hNear = nearCharacter(vUv, bgCol, 40.0);
          float hFar  = nearCharacter(vUv, bgCol, 85.0);
          float halo  = hFar * (0.25 + 0.75 * hNear);
          for(int gx = -1; gx <= 2; gx++){
            for(int gy = -2; gy <= 3; gy++){
              vec2 cellId = floor(vec2(vUv.x * aspect, vUv.y) / cellSz) + vec2(float(gx), float(gy));
              float rx = 0.2 + hash(cellId + vec2(41.2)) * 0.6;
              float ry = 0.2 + hash(cellId + vec2(13.9, 88.1)) * 0.6;
              float spd = 0.09 + hash(cellId + vec2(5.0)) * 0.06;
              vec2 kcenter;
              kcenter.x = (cellId.x + rx) * cellSz / aspect;
              kcenter.y = fract((cellId.y + ry) * cellSz + time * spd);
              float lifeFade = smoothstep(0.0, 0.14, kcenter.y) * smoothstep(1.05, 0.62, kcenter.y);
              float wobble = sin(time * 3.0 + hash(cellId) * 6.28 + kcenter.y * 8.0) * 0.010;
              vec2 kd = vec2((vUv.x - kcenter.x + wobble) * aspect, vUv.y - kcenter.y);
              float kgate = sqrt(lifeFade * halo); // shrink to nothing outside aura
              float ksz = (0.024 + hash(cellId + vec2(2.7)) * 0.012) * 1.85 * kgate;
              vec2 skullUV = kd / (max(ksz, 0.0001) * 2.2) + 0.5;
              float skSample = (skullUV.x > 0.0 && skullUV.x < 1.0 && skullUV.y > 0.0 && skullUV.y < 1.0)
                ? texture2D(skullIcon, skullUV).r : 0.0;
              float kalpha = step(0.5, skSample); // binary — no bleed-through
              float kcaustic = 0.5 + 0.5 * sin(time * 5.0 + hash(cellId) * 6.28);
              vec3 kCol = mix(vec3(0.0, 0.95, 0.85), vec3(0.4, 1.0, 1.0), kcaustic); // cyan→bright cyan
              extraCol  = mix(extraCol, kCol, kalpha);
              extraMask = max(extraMask, kalpha);
            }
          }
        }

      } else if(s < 5.5){
        // Regen: floating plus signs only — no status outline so nothing bleeds under shapes
        radius = 0.0;
        outlineCol = vec3(0.0);
        brightness = 0.0;
        float aspect = resolution.x / resolution.y;
        float cellSz = 0.20;
        // Soft halo gradient: full within 40px, fades to ~25% at 85px, hard 0 beyond
        float hNear = nearCharacter(vUv, bgCol, 40.0);
        float hFar  = nearCharacter(vUv, bgCol, 85.0);
        float halo  = hFar * (0.25 + 0.75 * hNear);
        for(int gx = -1; gx <= 2; gx++){
          for(int gy = -2; gy <= 3; gy++){
            vec2 cellId = floor(vec2(vUv.x * aspect, vUv.y) / cellSz) + vec2(float(gx), float(gy));
            float rx = hash(cellId) * 0.6 + 0.2;
            float ry = hash(cellId + vec2(17.3, 43.1)) * 0.6 + 0.2;
            float speed = 0.10 + hash(cellId + vec2(5.0)) * 0.07;
            vec2 center;
            center.x = (cellId.x + rx) * cellSz / aspect;
            center.y = fract((cellId.y + ry) * cellSz + time * speed);
            float lifeFade = smoothstep(0.0, 0.18, center.y) * smoothstep(1.05, 0.68, center.y);
            vec2 d = vec2((vUv.x - center.x) * aspect, vUv.y - center.y);
            float gate = sqrt(lifeFade * halo); // shrink size → no shape outside aura
            float sz = (0.040 + hash(cellId + vec2(2.1)) * 0.014) * gate;
            float barW = sz * 0.28;
            float vert  = max(abs(d.x) - barW, abs(d.y) - sz);
            float horiz = max(abs(d.x) - sz,   abs(d.y) - barW);
            float dist  = min(vert, horiz);
            float alpha = step(0.0, -dist); // binary — size=0 outside aura so alpha=0 there
            float sparkle = 0.85 + 0.15*sin(time*4.0 + hash(cellId)*6.28);
            extraCol  = mix(extraCol, vec3(0.1, 0.95, 0.35) * sparkle, alpha);
            extraMask = max(extraMask, alpha);
          }
        }

      } else if(s < 6.5){
        // Block: floating shields only — no status outline so nothing bleeds under shapes
        radius = 0.0;
        outlineCol = vec3(0.0);
        brightness = 0.0;
        float aspect = resolution.x / resolution.y;
        float cellSz = 0.275;
        float hNear = nearCharacter(vUv, bgCol, 40.0);
        float hFar  = nearCharacter(vUv, bgCol, 85.0);
        float halo  = hFar * (0.25 + 0.75 * hNear);
        for(int gx = -1; gx <= 2; gx++){
          for(int gy = -2; gy <= 3; gy++){
            vec2 cellId = floor(vec2(vUv.x * aspect, vUv.y) / cellSz) + vec2(float(gx), float(gy));
            float rx = 0.2 + hash(cellId) * 0.6;
            float ry = 0.2 + hash(cellId + vec2(9.1, 27.4)) * 0.6;
            float speed = (0.06 + hash(cellId + vec2(3.3)) * 0.04) * 1.25;
            vec2 center;
            center.x = (cellId.x + rx) * cellSz / aspect;
            center.y = fract((cellId.y + ry) * cellSz + time * speed);
            float lifeFade = smoothstep(0.0, 0.18, center.y) * smoothstep(1.05, 0.68, center.y);
            vec2 sd = vec2((vUv.x - center.x) * aspect, vUv.y - center.y);
            // Shrink size to zero outside aura — keeps mask binary, no bleed-through
            float gate = sqrt(lifeFade * halo);
            float sz = (0.026 + hash(cellId + vec2(6.7)) * 0.010) * 2.04 * gate; // 2.55 * 0.8
            vec2 iconUV = sd / (max(sz, 0.0001) * 2.2) + 0.5;
            float shSample = (iconUV.x > 0.0 && iconUV.x < 1.0 && iconUV.y > 0.0 && iconUV.y < 1.0)
              ? texture2D(shieldIcon, iconUV).r : 0.0;
            float alpha = step(0.5, shSample); // binary — size=0 outside aura so alpha=0 there
            float pulse = 0.88 + 0.12*sin(time*2.0 + hash(cellId)*6.28);
            extraCol  = mix(extraCol, vec3(0.0, 1.0, 1.0) * pulse, alpha); // cyan
            extraMask = max(extraMask, alpha);
          }
        }

      } else if(s < 7.5){
        // Reflect: double outline — main + fixed offset ghost
        radius = 2.0;
        float hue = fract(vUv.x * 0.4 + vUv.y * 0.3 + time * 0.35);
        outlineCol = 0.5 + 0.5*vec3(cos(hue*6.28), cos(hue*6.28+2.09), cos(hue*6.28+4.19));
        brightness = 1.3;

      } else if(s < 8.5){
        // Weak: opaque minus signs drifting downward, soft-edge halo zone
        float tremor = (hash(vec2(floor(vUv.y*120.0), floor(time*6.0)))-0.5)*0.004;
        warpedUv.x += tremor;
        radius = 0.0;
        outlineCol = vec3(0.0);
        brightness = 0.0;
        {
          float aspect = resolution.x / resolution.y;
          float cellSz = 0.20;
          float hNear = nearCharacter(vUv, bgCol, 40.0);
          float hFar  = nearCharacter(vUv, bgCol, 85.0);
          float halo  = hFar * (0.25 + 0.75 * hNear);
          for(int gx = -1; gx <= 2; gx++){
            for(int gy = -2; gy <= 3; gy++){
              vec2 cellId = floor(vec2(vUv.x * aspect, vUv.y) / cellSz) + vec2(float(gx), float(gy));
              float rx = hash(cellId) * 0.6 + 0.2;
              float ry = hash(cellId + vec2(31.7, 19.5)) * 0.6 + 0.2;
              float speed = 0.08 + hash(cellId + vec2(4.4)) * 0.06;
              vec2 center;
              center.x = (cellId.x + rx) * cellSz / aspect;
              center.y = fract((cellId.y + ry) * cellSz - time * speed);
              float lifeFade = smoothstep(1.0, 0.82, center.y) * smoothstep(-0.05, 0.28, center.y);
              vec2 md = vec2((vUv.x - center.x) * aspect, vUv.y - center.y);
              float mgate = sqrt(lifeFade * halo); // shrink to nothing outside aura
              float msz = (0.034 + hash(cellId + vec2(8.2)) * 0.012) * mgate;
              float barH = msz * 0.225;
              float minusDist = max(abs(md.x) - msz, abs(md.y) - barH);
              float malpha = step(0.0, -minusDist); // binary — size=0 outside aura so malpha=0 there
              float mfade  = 0.78 + 0.22 * sin(time * 2.5 + hash(cellId) * 6.28);
              extraCol  = mix(extraCol, vec3(0.58, 0.14, 0.88) * mfade, malpha);
              extraMask = max(extraMask, malpha);
            }
          }
        }

      } else if(s < 9.5){
        // Frail: Voronoi hairline cracks sweeping from outline inward, bright pink
        radius = 1.8;
        outlineCol = vec3(1.0, 0.2, 0.6); // bright pink outline
        brightness = 0.9;
        float aspect = resolution.x / resolution.y;
        vec2 cuv = vec2(vUv.x * aspect, vUv.y) * 7.0;
        float cracks = crackLines(cuv, 1.0, time * 0.06);
        // edgeProx gradient: ringNearBg inside char returns >0 when background is within radius.
        // Pixels right at the outline: e5>0. Deeper inside: need larger radius.
        // Adding charIn * 0.18 floor ensures all char pixels eventually get revealed.
        float charIn = isChar(vUv, bgCol);
        float e5  = ringNearBg(vUv, bgCol, 5.0,  8);
        float e25 = ringNearBg(vUv, bgCol, 25.0, 8);
        float e65 = ringNearBg(vUv, bgCol, 65.0, 8);
        // High near outline, moderate deep inside (floored so all char pixels can reveal)
        float edgeProx = max(charIn * 0.18, max(e5, max(e25 * 0.65, e65 * 0.35)));
        // Wave: threshold sweeps 1→0, revealing pixels where edgeProx > threshold
        float waveT = mod(time * 0.38, 1.8);
        float spreadFront = smoothstep(0.0, 1.1, min(waveT, 1.1));  // 0→1 over 1.1s
        float waveFade    = smoothstep(1.8, 1.4, waveT);             // fade before reset
        float threshold   = 1.0 - spreadFront;                       // 1→0 as wave spreads
        // Show cracks where edgeProx exceeds threshold (edge first, then inward)
        float revealMask = smoothstep(threshold - 0.1, threshold + 0.1, edgeProx);
        // Dark crack lines — near black with slight pink tinge
        extraCol  = mix(base.rgb * 0.06, vec3(0.06, 0.0, 0.04), 0.85);
        extraMask = cracks * revealMask * waveFade * 0.92;

      } else if(s < 10.5){
        // Leech: very fat, high-contrast undulating pink/purple — dramatic pulse
        float wobX = sin(vUv.y * 12.0 + time * 2.5) * 0.018 + sin(vUv.y*5.0+time*4.0)*0.01;
        float wobY = cos(vUv.x * 10.0 + time * 2.0) * 0.015 + cos(vUv.x*4.0+time*3.5)*0.008;
        warpedUv += vec2(wobX, wobY);
        float bigPulse = 0.5 + 0.5*sin(time*3.0);
        float fastFlicker = 0.6 + 0.4*sin(time*14.0 + vUv.y*8.0);
        radius = 4.0 + bigPulse * 7.0;
        outlineCol = mix(vec3(1.0,0.0,0.5), vec3(0.8,0.0,1.0), bigPulse);
        brightness = (1.5 + bigPulse * 1.0) * fastFlicker;
        samples = 12;

      } else if(s < 11.5){
        // Clear: sweeping pink wave up the outline (same tint as Purge)
        float sweep = fract(time * 0.7);
        float inSweep = smoothstep(sweep-0.1, sweep, vUv.y) * smoothstep(sweep+0.2, sweep, vUv.y);
        radius = 2.0 + inSweep * 4.0;
        outlineCol = mix(vec3(1.0,0.1,0.6), vec3(1.0,0.7,0.9), inSweep);
        brightness = 0.5 + inSweep * 1.2;

      } else {
        // Purge: rapidly expanding/contracting pink rings
        float ring = abs(sin(length(vUv-0.5)*30.0 - time*8.0));
        ring = smoothstep(0.4, 0.0, ring);
        radius = 2.5 + ring * 6.0;
        outlineCol = mix(vec3(1.0,0.1,0.6), vec3(1.0,0.7,0.9), ring);
        brightness = 0.8 + ring * 0.8;
      }

      // ── Detect outline: character pixel with at least one bg neighbour ──
      float charHere = isChar(warpedUv, bgCol);
      float nearBg   = ringNearBg(warpedUv, bgCol, radius, samples);
      float outline  = charHere * nearBg;

      // Reflect: also draw a second offset ghost outline
      if(s >= 6.5 && s < 7.5){
        vec2 ghostUv = vUv + vec2(0.012, -0.008);
        float ghostChar = isChar(ghostUv, bgCol);
        float ghostNearBg = ringNearBg(ghostUv, bgCol, 2.0, 8);
        float ghost = ghostChar * ghostNearBg;
        float hue2 = fract(vUv.x * 0.4 + vUv.y * 0.3 + time * 0.35 + 0.5);
        vec3 ghostCol = 0.5 + 0.5*vec3(cos(hue2*6.28), cos(hue2*6.28+2.09), cos(hue2*6.28+4.19));
        outline = max(outline, ghost);
        outlineCol = mix(outlineCol, ghostCol, ghost / max(outline, 0.001));
      }

      // ── Composite: outline first, then surface extras (regen/frail) ──
      vec3 col = mix(base.rgb, outlineCol * brightness, outline);
      // Surface extras — regen floats freely, frail confined to character
      float charActual = isChar(vUv, bgCol);
      float surfaceMask = (s >= 8.5 && s < 9.5) ? charActual : 1.0; // frail: char only
      col = mix(col, extraCol, extraMask * surfaceMask);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
};
const statusPass = new ShaderPass(StatusShader);
statusPass.enabled = false;

// ── Insert holo + status at the END of the look chain ──
// Order becomes: Render, outline, gamma, brightness, pixel, holo, status, posterize.
// Holo runs AFTER brightness so its translucency (fade-to-background) is the final
// word and isn't re-saturated by the ×2.53 brightness multiply.
composer.passes.splice(5, 0, holoPass);       // holo after pixel — owns the final look
composer.passes.splice(6, 0, statusPass);     // status on top of holo, before posterize

// Status metadata: label, outline colour, base tint for color filter
const STATUS_META = [
  null,
  { label: 'Vigor',     color: 'red',    abbr: 'VIG' },
  { label: 'Strike',    color: 'red',    abbr: 'STR' },

// ── Tint helpers ─────────────────────────────────────────────────────────────
// Toon gradient map: 3 bands
const gradData = new Uint8Array([0, 90, 160, 255]);
const gradTex  = new THREE.DataTexture(gradData, 4, 1, THREE.RedFormat);
gradTex.magFilter = THREE.NearestFilter;
gradTex.minFilter = THREE.NearestFilter;
gradTex.needsUpdate = true;

function tintedColor(colorKey) {
  // Lerp between neutral grey and full tint based on intensity
  const grey = new THREE.Color(0x888888);
  const full = PALETTE[colorKey].color;
  return new THREE.Color().lerpColors(grey, full, currentIntensity);
}

// Build the look-appropriate material for one mesh from its original material,
// honouring the current filter colour, PS1/toon mode and desaturate setting.
// Shared by the single view (applyTint) and the battle portrait viewers.
function makeCharacterMaterial(orig, colorKey = currentColorKey) {
  const p = PALETTE[colorKey];
  const noFilter = colorKey === 'none';

    if (ps1Mode) {
      // ── PS1 mode: flat-shaded Lambert + nearest-filter textures + vertex snap ──
      const lambert = new THREE.MeshLambertMaterial({
        flatShading: true,
        map:   orig.map || null,
        color: noFilter ? new THREE.Color(0xffffff) : tintedColor(colorKey),
      });

      if (lambert.map) {
        // Store original filters once so we can restore them later
        if (lambert.map.userData.origMagFilter === undefined) {
          lambert.map.userData.origMagFilter = lambert.map.magFilter;
          lambert.map.userData.origMinFilter  = lambert.map.minFilter;
          lambert.map.userData.origMipmaps    = lambert.map.generateMipmaps;
        }
        lambert.map.magFilter      = THREE.NearestFilter;
        lambert.map.minFilter      = THREE.NearestFilter;
        lambert.map.generateMipmaps = false;
        lambert.map.needsUpdate    = true;
      }

      // Vertex snapping + optional desaturate
      const ps1Desat = currentDesaturate;
      lambert.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader.replace(
          '#include <project_vertex>',
          `#include <project_vertex>
          float snapFactor = 185.0;
          gl_Position.xy = floor(gl_Position.xy / gl_Position.w * snapFactor + 0.5) / snapFactor * gl_Position.w;`
        );
        if (ps1Desat) {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <map_fragment>',
            `#ifdef USE_MAP
              vec4 sampledDiffuseColor = texture2D( map, vMapUv );
              float lum = dot( sampledDiffuseColor.rgb, vec3( 0.299, 0.587, 0.114 ) );
              diffuseColor *= vec4( vec3( lum ), sampledDiffuseColor.a );
            #endif`
          );
        }
      };
      lambert.customProgramCacheKey = () => `ps1-${noFilter ? 'nocolor' : 'color'}-${ps1Desat ? 'desat' : 'color'}`;

      return lambert;

    } else if (noFilter) {
      // ── No filter, no PS1: restore original material + texture filters ──
      if (orig.map && orig.map.userData.origMagFilter !== undefined) {
        orig.map.magFilter       = orig.map.userData.origMagFilter;
        orig.map.minFilter       = orig.map.userData.origMinFilter;
        orig.map.generateMipmaps = orig.map.userData.origMipmaps;
        orig.map.needsUpdate     = true;
      }
      return orig;

    } else {
      // ── Toon mode ──
      if (orig.map && orig.map.userData.origMagFilter !== undefined) {
        orig.map.magFilter       = orig.map.userData.origMagFilter;
        orig.map.minFilter       = orig.map.userData.origMinFilter;
        orig.map.generateMipmaps = orig.map.userData.origMipmaps;
        orig.map.needsUpdate     = true;
      }
      const toon = new THREE.MeshToonMaterial({
        map:         orig.map || null,
        gradientMap: gradTex,
        color:       tintedColor(colorKey),
      });
      if (currentDesaturate) {
        toon.onBeforeCompile = (shader) => {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <map_fragment>',
            `#ifdef USE_MAP
              vec4 sampledDiffuseColor = texture2D( map, vMapUv );
              float lum = dot( sampledDiffuseColor.rgb, vec3( 0.299, 0.587, 0.114 ) );
              diffuseColor *= vec4( vec3( lum ), sampledDiffuseColor.a );
            #endif`
          );
        };
        toon.customProgramCacheKey = () => 'desat';
      } else {
        toon.customProgramCacheKey = () => 'normal';
      }
      toon.needsUpdate = true;
      return toon;
    }
}

// Apply the current look to all meshes in the single-view scene + update chrome.
function applyTint(colorKey) {
  const p = PALETTE[colorKey];
  const noFilter = colorKey === 'none';

  // Outline whenever a color filter is active (toon or PS1)
  outlinePass.enabled = !noFilter;
  if (!noFilter) {
    outlinePass.visibleEdgeColor.set(p.hex);
    outlinePass.hiddenEdgeColor.set(p.hex);
  }

  meshList.forEach(mesh => {
    if (mesh.userData.origMat) mesh.material = makeCharacterMaterial(mesh.userData.origMat);
  });

  // Battle portrait viewers (if active) follow the same filter for outline + bg.
  if (viewMode === 'battle' && typeof refreshBattleTheme === 'function') refreshBattleTheme();

  const sidebarColor = noFilter ? '#555' : p.hex;
  document.documentElement.style.setProperty('--active-color', sidebarColor);
  const swatch = document.getElementById('swatch');
  swatch.style.background  = noFilter ? 'transparent' : p.hex;
  swatch.style.borderColor = noFilter ? '#333' : p.hex;

  // Tint the viewport background to a very dark shade of the active filter colour
  if (noFilter) {
    scene.background = new THREE.Color(0x0a0a0a);
    renderer.setClearColor(0x0a0a0a, 1);
  } else {
    const tinted = p.color.clone().multiplyScalar(0.004);
    scene.background = tinted;
    renderer.setClearColor(tinted, 1);
  }

  // Tint the hologram to match the active filter colour (preview).
  if (!noFilter && p.color) holoPass.uniforms.holoColor.value.copy(p.color);
}

// ── Load character ────────────────────────────────────────────────────────────
function loadCharacter(filepath, autoRotate = false, modelScale = 2.0) {
  loadingEl.textContent = 'LOADING…';
  loadingEl.style.display = 'flex';
  currentFilepath = filepath;

  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  if (mixer)        { mixer.stopAllAction(); mixer = null; }
  meshList = [];
  outlinePass.selectedObjects = [];

  const parts = filepath.split('/');
  const url = parts.map(encodeURIComponent).join('/');

  loader.load(url, (gltf) => {
    const model = gltf.scene;
    const wrap  = new THREE.Group();
    wrap.add(model);
    scene.add(wrap);
    wrap.updateMatrixWorld(true);

    // Auto-center + scale
    const bb     = new THREE.Box3().setFromObject(wrap);
    const size   = new THREE.Vector3(); bb.getSize(size);
    const center = new THREE.Vector3(); bb.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale  = modelScale / Math.max(maxDim, 0.001);
    wrap.scale.setScalar(scale);
    wrap.position.set(-center.x * scale, -center.y * scale + (size.y * scale * 0.5), -center.z * scale);

    // Pivot for clean rotation
    const pivot = new THREE.Group();
    scene.remove(wrap);
    pivot.add(wrap);
    scene.add(pivot);
    currentModel = pivot;

    // Collect meshes + stash original materials + enable shadows
    model.traverse(node => {
      if (!node.isMesh) return;
      node.castShadow = true;
      node.receiveShadow = true;
      node.userData.origMat = node.material;
      meshList.push(node);
    });

    // Snap ground plane to the bottom of the model
    const scaledBb = new THREE.Box3().setFromObject(pivot);
    ground.position.y = scaledBb.min.y;

    outlinePass.selectedObjects = meshList;

    // Animations — build clip list, populate the picker, play the default clip.
    currentClips  = gltf.animations || [];
    currentAction = null;
    if (currentClips.length) {
      mixer = new THREE.AnimationMixer(model);
      mixer.addEventListener('finished', onAnimFinished);
      populateAnimPicker();
      const def = defaultClipName(currentClips);
      if (animPicker) animPicker.value = def;
      playAnimation(def, 0);          // instant (no crossfade) on load
    } else {
      mixer = null;
      if (animPicker) animPicker.style.display = 'none';
    }
    // Carry the stop/stand-still preference onto the newly loaded model.
    applyFrozenState();

        // Re-center camera target on the model
    const modelCenter = new THREE.Vector3();
    new THREE.Box3().setFromObject(pivot).getCenter(modelCenter);
    controls.target.copy(modelCenter);
    controls.update();

    controls.autoRotate = autoRotate;
    applyTint(currentColorKey);

    // Pre-compile shaders now to avoid first-frame stutter
    renderer.compile(scene, camera);

    loadingEl.style.display = 'none';
    nameTag.textContent = filepath.split('/').pop().replace('.glb', '');
    if (multiOn && viewMode === 'single') applySingleMulti();

  }, undefined, (err) => {
    console.error('Load error:', err);
    loadingEl.textContent = 'FAILED TO LOAD';
  });
}

  poseBtn.classList.toggle('active', animFrozen);
  poseBtn.innerHTML = animFrozen
    ? '<span class="dl-arrow">▶</span> RESUME'
    : '<span class="dl-arrow">⏸</span> STAND STILL';

  // the character holds its current pose. (We avoid skeleton.pose(): these
  // walk-cycle GLBs have a degenerate bind pose that collapses the mesh.)

// ── Animation selection (crossfade between a model's clips) ──────────────────
const animPicker = document.getElementById('animPicker');
const CLIP_LABELS = { idle:'Idle', walk:'Walk', run:'Run', attack:'Attack', hit:'Hit', death:'Death', collect:'Collect' };
const ONE_SHOT    = new Set(['attack', 'hit', 'death', 'collect']);   // play once, don't loop
const CLIP_ORDER  = ['walk', 'run', 'attack', 'hit', 'death', 'collect'];
const HIDDEN_CLIPS = new Set(['idle', 'run']);   // excluded from pickers + never used as default/rest
const RESTING = 'walk';                   // default + post-one-shot pose (idle removed)

function clipLabel(name) { return CLIP_LABELS[name] || name.replace(/[_|]+/g, ' ').trim(); }
// First available resting clip (walk → run → first non-hidden) for a clip list.
function defaultClipName(clips) {
  const usable = clips.filter(c => !HIDDEN_CLIPS.has(c.name));
  return (['walk', 'run'].find(n => usable.some(c => c.name === n)) || (usable[0] && usable[0].name) || (clips[0] && clips[0].name));
}

function populateAnimPicker() {
  if (!animPicker) return;
  const usable = currentClips.filter(c => !HIDDEN_CLIPS.has(c.name));
  if (usable.length <= 1) { animPicker.style.display = 'none'; return; }
  const sorted = usable.sort((a, b) => {
    const ia = CLIP_ORDER.indexOf(a.name), ib = CLIP_ORDER.indexOf(b.name);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  animPicker.innerHTML = sorted
    .map(c => `<option value="${c.name}">${clipLabel(c.name)}</option>`).join('');
  animPicker.style.display = 'block';
}

function setupClipAction(clip) {
  const action = mixer.clipAction(clip);
  const oneShot = ONE_SHOT.has(clip.name);
  action.setLoop(oneShot ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  action.clampWhenFinished = oneShot;   // one-shots hold their last frame until we switch
  return action;
}

// Fade to a clip by name. fade=0 → instant (used on load).
function playAnimation(name, fade = 0.3) {
  if (!mixer) return;
  const clip = currentClips.find(c => c.name === name);
  if (!clip) return;
  const next = setupClipAction(clip);
  if (currentAction === next) { next.reset().play(); return; }
  next.reset();
  next.setEffectiveWeight(1);
  next.fadeIn(fade);
  next.play();
  if (currentAction) currentAction.fadeOut(fade);
  currentAction = next;
}

// One-shot clips return to idle when finished (death holds its final pose).
function onAnimFinished(e) {
  const name = e.action.getClip().name;
  if (name === 'death') return;
  const rest = defaultClipName(currentClips);
  if (rest) {
    playAnimation(rest, 0.3);
    if (animPicker) animPicker.value = rest;
  }
}

if (animPicker) {
  animPicker.addEventListener('change', e => {
    playAnimation(e.target.value, 0.3);
    e.target.blur();   // return focus to body so list arrow-keys keep working
  });
}

// ── Arrow-key navigation of the character list ────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  const panel = listEl.querySelector('.tab-panel.active');
  if (!panel) return;
  // Only navigate items in expanded (non-collapsed) sections of the active tab
  const items = [...panel.querySelectorAll('.section-content:not(.collapsed) .char-item')];
  if (!items.length) return;
  e.preventDefault();
  const curIdx = items.findIndex(i => i.classList.contains('active'));
  let next;
  if (curIdx === -1) {
    next = items[0];
  } else {
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    next = items[(curIdx + dir + items.length) % items.length];
  }
  next.click();
  next.scrollIntoView({ block: 'nearest' });
});

  const w = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  outlinePass.resolution.set(w, h);
  const pr = renderer.getPixelRatio();
  pixelPass.uniforms.resolution.value.set(w * pr, h * pr);
  statusPass.uniforms.resolution.value.set(w * pr, h * pr);
  holoPass.uniforms.resolution.value.set(w * pr, h * pr);
  if (viewMode === 'battle') layoutFrames();
}
